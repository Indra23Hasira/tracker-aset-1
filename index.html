<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Tracker</title>
<link rel="icon" href="favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180x180.png"/>
<link rel="apple-touch-icon" sizes="152x152" href="icon-152x152.png"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0a0e1a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Porto Tracker"/>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#f8f9fa;--bg2:#ffffff;--bg3:#f1f3f5;
  --text:#1a1a1a;--text2:#6b7280;--text3:#9ca3af;
  --border:#e5e7eb;--border2:#d1d5db;
  --blue:#185FA5;--blue2:#0C447C;--blue-bg:#EFF6FF;
  --green:#3B6D11;--green-bg:#F0FDF4;
  --red:#A32D2D;--red-bg:#FEF2F2;
  --amber:#BA7517;--amber-bg:#FFFBEB;
  --radius:8px;--radius2:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh}

/* LOGIN */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:2rem;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem}
.login-logo-icon{width:40px;height:40px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center}
.login-logo-icon svg{width:22px;height:22px}
.login-title{font-size:18px;font-weight:600}
.login-sub{font-size:13px;color:var(--text2)}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.ex-box{max-width:560px}
/* HOLD / SWING */
.kode-cell b{display:block}
td.kode-cell{padding-left:6px;padding-right:4px}
.pos-pill{display:inline-block;margin-top:3px;border:1px solid transparent;border-radius:20px;padding:0 6px;font-size:9.5px;font-weight:600;line-height:17px;cursor:pointer;font-family:inherit;white-space:nowrap}
.pos-pill.hold{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
.pos-pill.swing{background:#FFF7ED;color:#C2410C;border-color:#FED7AA}
.pos-pill.none{background:transparent;color:var(--text3);border:1px dashed var(--border2)}
.pos-pill:hover{filter:brightness(.96)}
.pos-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.pos-chip{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2);cursor:pointer;font-family:inherit;color:var(--text);min-width:140px;text-align:left;transition:border-color .15s}
.pos-chip:hover{border-color:var(--border2)}
.pos-chip .pc-l{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.pos-chip .pc-l b{color:var(--text)}
.pos-chip.hold .pc-l::before,.pos-chip.swing .pc-l::before,.pos-chip.none .pc-l::before{content:'';width:8px;height:8px;border-radius:50%;background:#4338CA}
.pos-chip.swing .pc-l::before{background:#EA580C}
.pos-chip.none .pc-l::before{background:transparent;border:1px dashed var(--text3);width:6px;height:6px}
.pos-chip .pc-v{font-size:12.5px;font-weight:600}
.pos-chip .pc-v span{font-size:11px;margin-left:4px}
.pos-chip.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,95,165,.12)}
.pos-empty{text-align:center;color:var(--text2);padding:18px 8px!important}
@media(max-width:640px){.pos-chip{min-width:0;flex:1 1 calc(50% - 8px)}}
/* BELI BULANAN */
.bb-intro{font-size:13px;color:var(--text2);margin:-4px 0 14px;max-width:820px;line-height:1.6}
.bb-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:16px 18px;margin-bottom:14px}
.bb-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 12px}
.bb-grid .form-group input,.bb-grid .form-group select{padding:8px 10px}
.bb-kurs{padding:9px 0;font-size:14px;font-weight:600}
.bb-mode{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.bb-mode button{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg2);font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.bb-mode button span{font-weight:400;color:var(--text2);margin-left:4px;font-size:12px}
.bb-mode button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.bb-mode button.on span{color:#dbeafe}
.bb-phead{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.bb-phead b{font-weight:600}
.bb-muted{color:var(--text2)}
.bb-small{font-size:11.5px}
.bb-warn{color:var(--red);font-weight:600;font-size:12.5px}
.bb-kelas{border-top:1px solid var(--border);padding:10px 0}
.bb-kelas.off .bb-items{opacity:.5}
.bb-khead{display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;font-size:12.5px}
.bb-kname{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;min-width:110px}
.bb-tgt{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--text2)}
.cell-input.bb-num{width:62px;text-align:right;padding:5px 7px}
.bb-i-po{white-space:nowrap}
.bb-tg{border:1px solid;border-radius:20px;padding:3px 11px;font-size:11.5px;font-weight:600;cursor:pointer;min-width:58px}
.bb-tg.on{background:var(--green-bg);border-color:#bbf7d0;color:var(--green)}
.bb-tg.off{background:var(--amber-bg);border-color:#fcd34d;color:var(--amber)}
.bb-items{margin:8px 0 0 18px;font-size:12.5px}
.bb-ihead,.bb-irow{display:grid;grid-template-columns:70px minmax(140px,1.6fr) 1fr 1fr 110px;gap:8px;align-items:center;padding:5px 0}
.bb-ihead{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding-bottom:2px}
.bb-irow{border-top:1px dashed var(--border)}
.bb-irow.off>span:not(:first-child){opacity:.5}
.bb-items .r{text-align:right}
.bb-mnote{font-size:10.5px;color:var(--red);font-weight:500;white-space:nowrap}
.bb-ifoot{font-size:11.5px;color:var(--text2);padding-top:6px}
.bb-badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--bg3);color:var(--text2);white-space:nowrap}
.bb-badge.bad{background:var(--red-bg);color:var(--red)}
.bb-badge.good{background:var(--green-bg);color:var(--green)}
.bb-badge.warn{background:var(--amber-bg);color:var(--amber)}
.bb-note{font-size:11.5px;color:var(--text3);margin-top:8px}
.bb-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.bb-tiles div{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px}
.bb-tiles span{display:block;font-size:10.5px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px}
.bb-tiles b{font-size:16px}
.bb-tbl .bb-crow td{background:var(--bg3)}
.bb-mob{display:none}
.bb-tbl .bb-ind{padding-left:30px}
.bb-txt{width:100%;min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:10px;border:1px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);resize:vertical}
.bb-empty{font-size:13px;color:var(--text2);padding:18px;text-align:center;background:var(--bg);border-radius:var(--radius)}
.bb-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bb-act-gap{flex:1}
.bb-flash{background:var(--green-bg);color:var(--green);border:1px solid #bbf7d0;border-radius:var(--radius);padding:9px 12px;font-size:13px;margin-bottom:10px}
.bb-done{background:var(--blue-bg);color:#1e40af;border:1px solid #bfdbfe;border-radius:var(--radius);padding:9px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
.bbc-box{max-width:640px}
.bbc-row{border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;transition:opacity .15s}
.bbc-row.off{opacity:.45}
.bbc-head{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:8px}
.bbc-head input{width:16px;height:16px;accent-color:var(--blue);flex-shrink:0}
.bbc-head .bb-muted{font-size:11.5px}
.bbc-cost{margin-left:auto;font-weight:600;font-size:13px;white-space:nowrap}
.bbc-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bbc-f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--text2);font-weight:500}
.bbc-f.w{grid-column:span 2}
.bbc-f input{padding:7px 9px;border:1px solid var(--border2);border-radius:6px;font-size:13px;color:var(--text);background:var(--bg2);font-family:inherit;width:100%}
.bbc-f input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(24,95,165,.1)}
.bbc-actions{position:sticky;bottom:-1.5rem;background:var(--bg2);margin-bottom:-1.5rem;padding-bottom:1.5rem;align-items:center;flex-wrap:wrap;z-index:1}
.bbc-total{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-right:auto;font-size:13px}
.bbc-total b{font-size:16px}
.bb-hist{display:flex;flex-direction:column;gap:6px}
.bb-hrow{border:1px solid var(--border);border-radius:var(--radius);background:var(--bg2)}
.bb-hrow summary{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:9px 12px;cursor:pointer;font-size:13px;list-style:none}
.bb-hrow summary::-webkit-details-marker{display:none}
.bb-hrow summary::before{content:'▸';color:var(--text3);font-size:11px;transition:transform .15s}
.bb-hrow[open] summary::before{transform:rotate(90deg)}
.bb-hdate{font-weight:600;min-width:92px}
.bb-hbody{border-top:1px solid var(--border);padding:6px 12px 10px}
.bb-hitem{display:grid;grid-template-columns:minmax(150px,1.2fr) 1.4fr 120px;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--border)}
.bb-hitem .r{text-align:right}
.bb-hfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:8px;font-size:12px}
.bb-undo{color:var(--red)}
@media(max-width:640px){
  .bb-panel{padding:14px}
  .bb-grid{grid-template-columns:1fr 1fr}
  .bb-grid .bb-wide{grid-column:1/-1}
  .bb-mode button{min-width:0}
  .bb-items{margin-left:0}
  .bb-ihead{display:none}
  .bb-irow{grid-template-columns:62px auto minmax(0,1fr) auto;grid-template-areas:"tg n n po" "tg v p po";gap:1px 8px}
  .bb-i-tg{grid-area:tg}.bb-i-n{grid-area:n;min-width:0}.bb-i-po{grid-area:po}
  .bb-items .bb-i-v{grid-area:v;text-align:left;font-size:11.5px}
  .bb-items .bb-i-p{grid-area:p;text-align:left;font-size:11.5px}
  .bb-tgt{margin-left:0}
  .bb-tiles{grid-template-columns:1fr 1fr;gap:8px}
  .bb-tiles b{font-size:14px}
  .bb-tbl th:nth-child(n+4),.bb-tbl td:nth-child(n+4){display:none}
  .bb-tbl td{white-space:normal;padding:8px 6px}
  .bb-tbl td.r{white-space:nowrap}
  .bb-tbl .bb-crow td:first-child{white-space:nowrap;overflow:visible}
  .bb-tbl .bb-badge{white-space:normal}
  .bb-mob{display:inline}
  .bb-hitem{grid-template-columns:1fr auto}
  .bb-hitem>span:nth-child(2){grid-column:1/-1;grid-row:2;color:var(--text2)}
  .bbc-f.w{grid-column:1/-1}
  .bb-act-gap{display:none}
  .bb-tbl .bb-ind{padding-left:16px}
}
.alert-green{background:var(--green-bg);color:var(--green);border:1px solid #bbf7d0}
.link-btn{border:none;background:none;padding:0;color:var(--blue);font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.set-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:16px 18px;margin-bottom:14px;max-width:560px}
.set-title{font-size:14px;font-weight:600;margin-bottom:12px}
.set-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:none}
.set-row span{color:var(--text2)}
.set-row b{font-weight:600;text-align:right;word-break:break-all}
.set-form .form-group{margin-bottom:12px}
.set-check{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text2);margin:2px 0 14px;cursor:pointer}
.set-check input{accent-color:var(--blue)}
.set-sub{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text2)}
.ex-all-row{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;background:var(--bg3);border-radius:var(--radius);cursor:pointer}
.ex-group{font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:480px){.ex-grid{grid-template-columns:1fr}}
.ex-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.ex-item:hover{border-color:var(--border2)}
.ex-item:has(input:checked){border-color:#bfdbfe;background:var(--blue-bg)}
.ex-item input,.ex-all-row input{width:15px;height:15px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.ex-n{margin-left:auto;font-size:11px;color:var(--text3)}
.ex-actions{flex-wrap:wrap;position:sticky;bottom:-1.5rem;background:var(--bg2);margin-bottom:-1.5rem;padding-bottom:1.5rem;z-index:1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;color:var(--text);background:var(--bg2);font-family:inherit}
.form-group select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.form-group input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius);font-size:14px;color:var(--text);background:var(--bg2);transition:border .2s,box-shadow .2s}
.form-group input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border:1px solid var(--border2);border-radius:var(--radius);font-size:13px;font-weight:500;cursor:pointer;background:var(--bg2);color:var(--text);transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg3);border-color:var(--border)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:var(--blue2);border-color:var(--blue2)}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-success:hover{background:#27500A;border-color:#27500A}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-full{width:100%}
.btn-icon{padding:5px 8px;font-size:13px;color:var(--text2)}
.btn-icon:hover{color:var(--red)}
.btn-icon-edit{padding:5px 8px;font-size:13px;color:var(--text2)}
.btn-icon-edit:hover{color:var(--blue)}
.row-actions{display:flex;gap:2px;align-items:center}
.login-divider{text-align:center;font-size:12px;color:var(--text3);margin:14px 0;position:relative}
.login-divider::before,.login-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:var(--border)}
.login-divider::before{left:0}.login-divider::after{right:0}
.google-btn{background:#fff;border:1px solid var(--border2);color:var(--text);width:100%;padding:10px;border-radius:var(--radius);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;font-weight:500;transition:all .15s}
.google-btn:hover{background:var(--bg3);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.alert{padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:12px}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid #fca5a5}
.alert-blue{background:var(--blue-bg);color:var(--blue);border:1px solid #bfdbfe}

/* APP LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{display:flex;align-items:center;gap:8px}
.header-logo-icon{width:28px;height:28px;background:var(--blue);border-radius:7px;display:flex;align-items:center;justify-content:center}
.header-logo-icon svg{width:16px;height:16px}
.logo-text{font-size:15px;font-weight:600}
.user-pill{font-size:12px;color:var(--text2);background:var(--bg3);padding:3px 10px;border-radius:20px;border:1px solid var(--border)}
.save-status{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.save-status.saved{color:var(--green)}
.demo-pill{background:var(--amber-bg);color:var(--amber);border-color:#fcd34d;font-weight:600}
.privacy-btn{color:var(--text2)}
.privacy-btn svg{width:16px;height:16px}
.privacy-btn.on{background:var(--blue-bg);color:var(--blue);border-color:#bfdbfe}
/* SIDEBAR */
.app-body{display:flex;align-items:flex-start;flex:1}
.sidebar{position:sticky;top:52px;height:calc(100vh - 52px);height:calc(100dvh - 52px);width:200px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bg2);border-right:1px solid var(--border);transition:width .2s ease;z-index:5}
.sb-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 10px 16px;scrollbar-width:thin}
.sb-footer{flex-shrink:0;border-top:1px solid var(--border);padding:10px}
.sb-toggle{position:absolute;top:14px;right:-13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--border2);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);box-shadow:0 1px 3px rgba(0,0,0,.08);z-index:6;padding:0}
.sb-toggle:hover{color:var(--blue);border-color:var(--blue)}
.sb-toggle svg{width:14px;height:14px;transition:transform .2s}
.sb-group{font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;padding:16px 10px 6px;white-space:nowrap}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:5px 8px;margin-bottom:2px;border:none;background:transparent;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--text2);cursor:pointer;text-align:left;white-space:nowrap;position:relative;transition:background .15s,color .15s}
.sb-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--t);color:var(--c);transition:background .15s,color .15s,box-shadow .15s}
.sb-ico svg{width:17px;height:17px}
.sb-item:hover{background:var(--bg3);color:var(--text)}
.sb-item.active{background:var(--bg3);color:var(--text);font-weight:600}
.sb-item.active .sb-ico{background:var(--c);color:#fff;box-shadow:0 2px 8px var(--t2)}
.sb-item.active::before{content:'';position:absolute;left:-10px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--c)}

<script>
// ============================================================
// 🔧 KONFIGURASI FIREBASE — ISI DENGAN DATA ANDA

// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyA2CCb37na5ZNnyfdVjbgInEASwl_rCx9w",
  authDomain: "aset-indra.firebaseapp.com",
  projectId: "aset-indra",
  storageBucket: "aset-indra.firebasestorage.app",
  messagingSenderId: "205158118194",
  appId: "1:205158118194:web:73b6bee556e5baeced1d2b",
  measurementId: "G-70H098XC6V"
};

const IS_CONFIGURED = !!(
  firebaseConfig &&
  firebaseConfig.apiKey &&
  firebaseConfig.projectId
);


// ── DATA DEFAULT ──────────────────────────────────────────
const DEFAULT_DATA = {
  kurs: 17800,
  umur: 0,
  saham: [],
  divBei: [],
  etf: [],
  divEtf: [],
  emas: [],
  btc: [],
  dana: [],
  rdana: [],
  obligasi: [],
  goals: [],
};

// ── TARGET ALOKASI ────────────────────────────────────────
const DEFAULT_TARGET = {
  kelas: {
    saham:    {min:30, max:45, label:'Saham BEI'},
    etf:      {min:20, max:40, label:'US'},
    emas:     {min:5,  max:10, label:'Emas'},
    btc:      {min:0,  max:5,  label:'Crypto'},
    rdana:    {min:5,  max:15, label:'Reksadana'},
    obligasi: {min:0,  max:10, label:'Obligasi/SBN'}
  },
  sahamKategori: {
    blue:       {min:25, max:32, label:'Blue Chip'},
    menengah:   {min:5,  max:8,  label:'Menengah / Wajar'},
    komoditas:  {min:5,  max:10, label:'Komoditas / Siklikal'},
    spekulatif: {min:0,  max:4,  label:'Spekulatif'}
  }
};
const KATEGORI_OPTS = [
  {v:'blue', l:'Blue Chip', s:'Blue Chip', bg:'#EFF6FF', fg:'#185FA5'},
  {v:'menengah', l:'Menengah / Wajar', s:'Menengah', bg:'#F0FDF4', fg:'#3B6D11'},
  {v:'komoditas', l:'Komoditas / Siklikal', s:'Komoditas', bg:'#F1F3F5', fg:'#1a1a1a'},
  {v:'spekulatif', l:'Spekulatif', s:'Spekulatif', bg:'#FEF2F2', fg:'#A32D2D'}
];
// Lookup bantu untuk tombol "Auto-kategori" — silakan tambah/ubah sesuai penilaian sendiri
const KATEGORI_MAP = {
  BBCA:'blue', BMRI:'blue', ASII:'blue', TLKM:'blue',
  ADRO:'menengah',
  ADMR:'komoditas', AMMN:'komoditas', TAPG:'komoditas', DEWA:'komoditas',
  PPRE:'spekulatif', RANS:'spekulatif'
};
function ensureTargetDefaults() {
  if (!APP.data.targetAlokasi) APP.data.targetAlokasi = JSON.parse(JSON.stringify(DEFAULT_TARGET));
  // Merge min/max dari Firestore, tapi label SELALU dari DEFAULT_TARGET (kode)
  Object.keys(DEFAULT_TARGET.kelas).forEach(k => {
    if (!APP.data.targetAlokasi.kelas) APP.data.targetAlokasi.kelas = {};
    if (!APP.data.targetAlokasi.kelas[k]) APP.data.targetAlokasi.kelas[k] = {};
    APP.data.targetAlokasi.kelas[k].label = DEFAULT_TARGET.kelas[k].label; // selalu override label
    if (APP.data.targetAlokasi.kelas[k].min === undefined) APP.data.targetAlokasi.kelas[k].min = DEFAULT_TARGET.kelas[k].min;
    if (APP.data.targetAlokasi.kelas[k].max === undefined) APP.data.targetAlokasi.kelas[k].max = DEFAULT_TARGET.kelas[k].max;
  });
  APP.data.targetAlokasi.sahamKategori = Object.assign({}, DEFAULT_TARGET.sahamKategori, APP.data.targetAlokasi.sahamKategori);
  // Force label sahamKategori dari DEFAULT_TARGET juga
  Object.keys(DEFAULT_TARGET.sahamKategori).forEach(k => {
    if (APP.data.targetAlokasi.sahamKategori[k]) {
      APP.data.targetAlokasi.sahamKategori[k].label = DEFAULT_TARGET.sahamKategori[k].label;
    }
  });
}
function autoTagKategori() {
  (APP.data.saham||[]).forEach(s => {
    const k = KATEGORI_MAP[(s.kode||'').toUpperCase()];
    if (k) s.kategori = k;
    else if (!s.kategori) s.kategori = 'menengah';
  });
  scheduleSave();
  render();
}

// ── STATE ─────────────────────────────────────────────────
let APP = {
  user: null,
  data: null,
  tab: 'dash',
  modal: null,
  editArr: null,
  editIdx: null,
  saving: false,
  saveTimer: null,
  db: null,
  auth: null,
  error: null,
  taEditing: false,
  compoundAutoMsg: null,
};

// ── FIREBASE INIT ─────────────────────────────────────────
if (IS_CONFIGURED) {
  try {
    firebase.initializeApp(firebaseConfig);
    APP.auth = firebase.auth();
    APP.db = firebase.firestore();
    APP.auth.onAuthStateChanged(async (user) => {
      if (APP.demo) return; // mode demo tidak boleh tertimpa/terganggu login
      if (user) {
        APP.user = user;
        APP.data = await loadFromFirestore(user.uid);
      } else {
        APP.user = null;
        APP.data = null;
      }
      render();
    });
  } catch(e) {
    APP.error = e.message;
    render();
  }
} else {
  render();
}

// ── FIRESTORE ─────────────────────────────────────────────
async function loadFromFirestore(uid) {
  try {
    const doc = await APP.db.collection('portfolios').doc(uid).get();
    if (doc.exists) return doc.data();
  } catch(e) { console.error(e); }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}

function scheduleSave() {
  if (APP.demo) return; // MODE DEMO: tidak pernah menyimpan apa pun ke database
  if (!IS_CONFIGURED || !APP.user || !APP.data) return;
  clearTimeout(APP.saveTimer);
  APP.saving = true;
  renderSaveStatus();
  APP.saveTimer = setTimeout(async () => {
    try {
      await APP.db.collection('portfolios').doc(APP.user.uid).set(APP.data);
    } catch(e) { console.error(e); }
    APP.saving = false;
    renderSaveStatus();
  }, 800);
}

function renderSaveStatus() {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.className = 'save-status' + (APP.saving ? '' : ' saved');
  el.innerHTML = APP.saving ? '⏳ Menyimpan...' : '✓ Tersimpan';
}

// ── AUTH ──────────────────────────────────────────────────
// Pesan error Firebase Auth dalam bahasa Indonesia
function authMsg(e) {
  const M = {
    'auth/invalid-email': 'Format email tidak valid.',
    'auth/missing-password': 'Password belum diisi.',
    'auth/wrong-password': 'Password salah.',
    'auth/invalid-credential': 'Email atau password salah.',
    'auth/invalid-login-credentials': 'Email atau password salah.',
    'auth/weak-password': 'Password terlalu lemah, minimal 6 karakter.',
    'auth/too-many-requests': 'Terlalu banyak percobaan. Tunggu beberapa menit lalu coba lagi.',
    'auth/network-request-failed': 'Koneksi internet bermasalah. Coba lagi.',
    'auth/requires-recent-login': 'Demi keamanan, silakan keluar lalu login ulang, kemudian coba lagi.',
    'auth/user-disabled': 'Akun ini dinonaktifkan.',
    'auth/popup-closed-by-user': 'Jendela login Google ditutup sebelum selesai.',
  };
  return M[e && e.code] || (e && e.message) || 'Terjadi kesalahan.';
}
function loginMsg(text, ok) {
  const el = document.getElementById('login-err');
  if (!el) return;
  el.className = 'alert ' + (ok ? 'alert-blue' : 'alert-red');
  el.textContent = text;
  el.style.display = text ? 'block' : 'none';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  loginMsg('');
  if (!email || !pass) { loginMsg('Isi email dan password dulu.'); return; }
  try {
    await APP.auth.signInWithEmailAndPassword(email, pass);
  } catch(e) {
    if (e.code === 'auth/user-not-found' || e.code === 'auth/invalid-credential' || e.code === 'auth/invalid-login-credentials') {
      // email belum terdaftar → otomatis daftar
      try {
        await APP.auth.createUserWithEmailAndPassword(email, pass);
      } catch(e2) {
        if (e2.code === 'auth/email-already-in-use') loginMsg('Password salah. Lupa password? Klik "Lupa password?" di bawah kolom password.');
        else loginMsg(authMsg(e2));
      }
    } else {
      loginMsg(authMsg(e));
    }
  }
}

async function doForgotPassword() {
  const email = document.getElementById('login-email').value.trim();
  if (!email) { loginMsg('Isi email dulu di kolom Email, lalu klik "Lupa password?" lagi.'); document.getElementById('login-email').focus(); return; }
  try {
    APP.auth.languageCode = 'id';
    await APP.auth.sendPasswordResetEmail(email);
    loginMsg(`Kalau ${email} terdaftar, link untuk membuat password baru sudah dikirim. Cek inbox (dan folder spam).`, true);
  } catch(e) {
    loginMsg(authMsg(e));
  }
}

async function doGoogleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  try { await APP.auth.signInWithPopup(provider); } catch(e) { loginMsg(authMsg(e)); }
}

function doLogout() {
  if (APP.demo) { exitDemo(); return; }
  if (IS_CONFIGURED) APP.auth.signOut();
  else { APP.user = null; APP.data = null; render(); }
}

// ── FORMATTERS ────────────────────────────────────────────
const R = n => Math.round(n || 0);
const F = (n, d=0) => (isNaN(n)||n==null) ? '-' : new Intl.NumberFormat('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const MASK = '••••••';
const Rp = n => (n==null||isNaN(n)) ? '-' : (APP.privacy ? 'Rp '+MASK : 'Rp ' + F(n));
const Usd = (n, d=2) => APP.privacy ? '$'+MASK : '$' + F(n, d);
const Q = v => APP.privacy ? '•••' : v; // jumlah lot/unit/gram/koin
const Pct = n => n==null ? '-' : (n>=0?'+':'') + F(n*100,2) + '%';
const Cls = n => n > 0 ? 'pos' : n < 0 ? 'neg' : '';

// ── CALCULATIONS ──────────────────────────────────────────
function cSaham() {
  return (APP.data.saham||[]).map(s => {
    const m=s.lot*100*s.beli, v=s.lot*100*s.now, pl=v-m;
    return {...s, m, v, pl, pct: m ? pl/m : 0};
  });
}
function cEtf() {
  const k = APP.data.kurs||17800;
  return (APP.data.etf||[]).map(e => {
    const mu=e.unit*e.beli, vu=e.unit*e.now, vi=vu*k, mi=mu*k, pl=vi-mi;
    return {...e, mu, vu, vi, mi, pl, pct: mi ? pl/mi : 0};
  });
}
function cEmas() {
  return (APP.data.emas||[]).map(e => {
    const m=e.gram*e.beli, v=e.gram*e.now, pl=v-m;
    return {...e, m, v, pl};
  });
}
function cBtc() {
  return (APP.data.btc||[]).map(b => {
    const m=b.jumlah*b.beli, v=b.jumlah*b.now, pl=v-m;
    return {...b, m, v, pl};
  });
}
// ── POSISI HOLD / SWING (Saham BEI & US) ─────────────────
// Field 'posisi' = 'hold' | 'swing' | ''. Data lama tanpa field ini dibaca dari kolom Keterangan.
const POSISI_OPTS = [{v:'',l:'— Belum ditandai'},{v:'hold',l:'Hold (jangka panjang)'},{v:'swing',l:'Swing (trading)'}];
function posisiOf(x) {
  if (x.posisi === 'hold' || x.posisi === 'swing' || x.posisi === '') return x.posisi;
  const k = (x.ket||'').toLowerCase();
  return k.includes('hold') ? 'hold' : k.includes('swing') ? 'swing' : '';
}
const isHold = x => posisiOf(x) === 'hold';
const posLabel = x => ({hold:'Hold', swing:'Swing'})[posisiOf(x)] || '';
function posPill(arr, i, x) {
  const p = posisiOf(x);
  const lbl = p === 'hold' ? 'Hold' : p === 'swing' ? 'Swing' : 'Tandai';
  return `<button class="pos-pill ${p||'none'}" onclick="cyclePosisi('${arr}',${i})" title="Klik untuk ganti Hold / Swing">${lbl}</button>`;
}
function cyclePosisi(arr, i) {

// rows: hasil cSaham()/cEtf(); fM/fV: ambil modal & nilai (IDR) per baris
function posChips(arr, rows, fM, fV) {
  const cur = APP.posFilter[arr] || 'all';
  const grp = [['all','Semua',()=>true],['hold','Hold',r=>posisiOf(r)==='hold'],['swing','Swing',r=>posisiOf(r)==='swing'],['','Belum ditandai',r=>posisiOf(r)==='']];
  return `<div class="pos-chips">${grp.map(([v,l,fn]) => {
    const rs = rows.filter(fn);
    if (v === '' && !rs.length && cur !== '') return '';
    const m = rs.reduce((a,r)=>a+fM(r),0), val = rs.reduce((a,r)=>a+fV(r),0), pl = val - m;
    return `<button class="pos-chip ${v||'none'}${cur===v?' on':''}" onclick="setPosFilter('${arr}','${v}')">
      <span class="pc-l">${l} <b>${rs.length}</b></span>
      <span class="pc-v">${Rp(R(val))} <span class="${Cls(pl)}">${m ? Pct(pl/m) : ''}</span></span></button>`;
  }).join('')}</div>`;
}
function posFiltered(arr, rows) {
  const cur = APP.posFilter[arr] || 'all';
  const withIdx = rows.map((r,i) => ({r, i}));
  return cur === 'all' ? withIdx : withIdx.filter(o => posisiOf(o.r) === cur);
}

const tSaham = () => cSaham().reduce((a,r)=>a+r.v, 0);
const tEtf   = () => cEtf().reduce((a,r)=>a+r.vi, 0);
const tEmas  = () => cEmas().reduce((a,r)=>a+r.v, 0);
const tBtc   = () => cBtc().reduce((a,r)=>a+r.v, 0);
const tDana  = () => (APP.data.dana||[]).reduce((a,r)=>a+(r.now||r.masuk), 0);
const tRdana = () => (APP.data.rdana||[]).reduce((a,r)=>a+(r.now||r.masuk), 0);

function getNilaiNominal(ob) {
  // 1 unit = Rp 1.000.000
  return (ob.unit || 0) * 1000000;
}
function getModalBeli(ob) {
  const nominal = getNilaiNominal(ob);
  const hargaPct = ob.hargaPct || 100;
  return Math.round(nominal * hargaPct / 100);
}

function hitungBungaAkrual(ob) {
  const nominal = getNilaiNominal(ob);
  const kupon   = ob.kupon || 0;
  if (!ob.tgl || nominal <= 0 || kupon <= 0) return 0;
  const tglBeli = new Date(ob.tgl);
  const today   = new Date();
  const hariJalan = Math.max(0, Math.floor((today - tglBeli) / (1000*60*60*24)));
  return Math.round(nominal * (kupon/100) / 365 * hariJalan);
}

const tObligasi = () => (APP.data.obligasi||[]).reduce((a,r) => {
  const bunga = hitungBungaAkrual(r);
  return a + getNilaiNominal(r) + bunga;
}, 0);
const tDivBei= () => (APP.data.divBei||[]).reduce((a,r)=>a+r.bruto, 0);
const tDivEtf= () => (APP.data.divEtf||[]).reduce((a,r)=>a+r.bruto*(APP.data.kurs||17800), 0);

function taRow(id, label, pctNow, min, max, editing, dotColor) {
  const inRange = pctNow >= min && pctNow <= max;
  const below = pctNow < min;
  const color = inRange ? 'var(--green)' : (below ? 'var(--amber)' : 'var(--red)');
  // Skala bar dibuat relatif terhadap target (bukan 0-100% mutlak), supaya band kecil seperti 5-10% tetap kelihatan jelas.
  const scale = Math.max(max * 1.4, pctNow * 1.15, 1);
  const barPct = Math.max(0, Math.min(100, (pctNow/scale)*100));
  const markMin = Math.max(0, Math.min(100, (min/scale)*100));
  const markMax = Math.max(0, Math.min(100, (max/scale)*100));
  const dotHtml = dotColor ? `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotColor};margin-right:6px"></span>` : '';
  const editHtml = editing
    ? `<span style="font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px">Target
        <input id="ta_${id}_min" type="number" value="${min}" style="width:44px;padding:2px 4px;font-size:11px;border:1px solid var(--border2);border-radius:4px">–
        <input id="ta_${id}_max" type="number" value="${max}" style="width:44px;padding:2px 4px;font-size:11px;border:1px solid var(--border2);border-radius:4px">%</span>`
    : `<span style="font-size:11px;color:var(--text2)">Target ${min===max?min:min+'–'+max}%</span>`;
  return `<div style="margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:3px">
      <span>${dotHtml}${label}</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-weight:600;color:${color}">${pctNow.toFixed(1)}%</span>
        ${editHtml}
      </div>
    </div>
    <div class="progress-bar" style="position:relative;overflow:visible">
      <div class="progress-fill" style="width:${barPct}%;background:${color}"></div>
      <div style="position:absolute;top:-2px;left:${markMin}%;width:1px;height:10px;background:var(--text2);opacity:.6"></div>
      <div style="position:absolute;top:-2px;left:${markMax}%;width:1px;height:10px;background:var(--text2);opacity:.6"></div>
    </div>
  </div>`;
}

function vTargetAlokasi(tot, ts, te, tem, tb) {
  ensureTargetDefaults();
  const T = APP.data.targetAlokasi;
  const editing = APP.taEditing;

  const kelasVals = {
    saham:    ts,
    etf:      te,
    emas:     tem,
    btc:      tb,
    rdana:    tRdana(),
    obligasi: tObligasi(),
  };
  const tot6 = Object.values(kelasVals).reduce((a,v)=>a+v, 0) || tot || 1;
  const kelasRows = Object.keys(DEFAULT_TARGET.kelas).map(k => {
    const val = kelasVals[k] || 0;
    const pct = tot6 > 0 ? (val/tot6*100) : 0;
    return taRow('kelas_'+k, T.kelas[k].label, pct, T.kelas[k].min, T.kelas[k].max, editing);
  }).join('');

  // Sub-kategori saham BEI, dihitung terhadap total investasi (bukan terhadap total saham saja)
  const sahamByKat = {};
  cSaham().forEach(s => {
    const k = s.kategori || 'menengah';
    sahamByKat[k] = (sahamByKat[k]||0) + s.v;
  });
  const subRows = Object.keys(DEFAULT_TARGET.sahamKategori).map(k => {
    const val = sahamByKat[k] || 0;
    const pct = tot > 0 ? (val/tot*100) : 0;
    return taRow('sub_'+k, T.sahamKategori[k].label, pct, T.sahamKategori[k].min, T.sahamKategori[k].max, editing);
  }).join('');

  // Saran alokasi setoran bulanan untuk sub-kategori saham
  let saran = '';
  if (tot > 0 && ts > 0) {
    const gaps = Object.keys(DEFAULT_TARGET.sahamKategori).map(k => {
      const val = sahamByKat[k] || 0;
      const pct = (val/tot*100);
      return {k, label:T.sahamKategori[k].label, gap: T.sahamKategori[k].min - pct};
    }).sort((a,b) => b.gap - a.gap);
    if (gaps[0].gap > 0.1) {
      saran = `💡 Setoran bulanan ke saham BEI bulan ini paling pas diarahkan ke kategori <b>${gaps[0].label}</b> — masih ${gaps[0].gap.toFixed(1)}% di bawah target minimum.`;
    } else {
      saran = `💡 Semua kategori saham BEI sudah berada dalam rentang target. Setoran bulan ini bebas dialokasikan sesuai keputusan sendiri, atau prioritaskan kategori dengan gap terkecil.`;
    }
  } else {
    saran = `💡 Isi kategori risiko di tab Saham BEI (atau klik "🏷 Auto-kategori") supaya saran ini bisa dihitung.`;
  }

  return `
  <div class="donut-container" style="margin-bottom:16px">
    <div class="donut-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>🎯 Target Alokasi</span>
      ${editing
        ? `<div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="toggleTaEdit()">Batal</button><button class="btn btn-sm btn-primary" onclick="saveTargetAlokasi()">💾 Simpan</button></div>`
        : `<button class="btn btn-sm" onclick="toggleTaEdit()">✏️ Atur Target</button>`}
    </div>
    ${kelasRows}
    <div style="font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 10px">Sub-kategori Saham BEI</div>
    ${subRows}
    <div style="font-size:12px;color:var(--text2);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">${saran}</div>
  </div>`;
}

function vDash() {
  const ts=tSaham(), te=tEtf(), tem=tEmas(), tb=tBtc(), td=tDana(), trd=tRdana(), tob=tObligasi();
  const tot = ts+te+tem+tb+trd+tob;
  const items = [['Saham BEI',ts,'#185FA5'],['US',te,'#3B6D11'],['Emas',tem,'#BA7517'],['Crypto',tb,'#A32D2D'],['Reksadana',trd,'#7c3aed'],['Obligasi',tob,'#0891b2']];
  // Modal per kelas aset, untuk P&L belum terealisasi (dividen tidak dihitung)
  const modalKelas = [
    cSaham().reduce((a,r)=>a+r.m,0),
    cEtf().reduce((a,r)=>a+r.mi,0),
    cEmas().reduce((a,r)=>a+r.m,0),
    cBtc().reduce((a,r)=>a+r.m,0),
    (APP.data.rdana||[]).reduce((a,r)=>a+(r.masuk||0),0),
    (APP.data.obligasi||[]).reduce((a,r)=>a+getModalBeli(r),0),
  ];
  const totModal = modalKelas.reduce((a,v)=>a+v,0), totPL = tot - totModal;
  const sPct = v => (v>0?'+':'') + F(v,2) + '%';
  const allocRows = items.map(([l,v,c],i) => {
    const m = modalKelas[i], pl = v - m, ada = m > 0 || v > 0;
    return `<tr${ada?'':' class="al-empty"'}>
      <td><span class="legend-dot" style="background:${c}"></span>${l}</td>
      <td class="al-num"><b>${tot>0?F(v/tot*100,1)+'%':'-'}</b></td>
      <td class="al-num ${ada?Cls(pl):''}">${ada?Rp(R(pl)):'–'}</td>
      <td class="al-num ${ada?Cls(pl):''}">${m>0?sPct(pl/m*100):'–'}</td>
      <td class="al-num ${ada?Cls(pl):''}">${ada&&totModal>0?sPct(pl/totModal*100):'–'}</td>
    </tr>`;
  }).join('');
  const CIRC = 2*Math.PI*38;
  let donut=''; let cum=0;
  items.filter(x=>x[1]>0).forEach(([l,v,c])=>{
    const p=v/tot, d=p*CIRC, off=cum*CIRC;
    donut+=`<circle cx="48" cy="48" r="38" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${d.toFixed(2)} ${(CIRC-d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 48 48)"/>`;
    cum+=p;
  });

  // ── Dividen chart data ─────────────────────────────────
  const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];

  // Cari tahun terakhir yang ada data dividen
  function latestYear(arr) {
    if (!arr || !arr.length) return new Date().getFullYear();
    return Math.max(...arr.map(d => new Date(d.tgl).getFullYear()));
  }
  const yearBei = latestYear(APP.data.divBei);
  const yearEtf = latestYear(APP.data.divEtf);

  function monthlyDiv(arr, amtKey, multiply, year) {
    const map = Array(12).fill(0);
    (arr||[]).forEach(d => {
      const dt = new Date(d.tgl);
      if (dt.getFullYear() !== year) return;
      const m = dt.getMonth();
      map[m] += (d[amtKey]||0) * (multiply||1);
    });
    return map;
  }

  const divBeiMonthly = monthlyDiv(APP.data.divBei, 'bruto', 1, yearBei);
  const divEtfMonthly = monthlyDiv(APP.data.divEtf, 'bruto', APP.data.kurs||17800, yearEtf);

  function barChart(monthly, title, color, year) {
    const max = Math.max(...monthly, 1);
    const W = 560, H = 160, PAD_L = 70, PAD_R = 16, PAD_TOP = 28, PAD_BOT = 36;
    const chartW = W - PAD_L - PAD_R;
    const chartH = H - PAD_TOP - PAD_BOT;
    const barW = Math.floor(chartW / 12 * 0.55);
    const gap = chartW / 12;

    // y-axis labels (3 ticks)
    const ticks = [0, Math.round(max/2), max];
    const yLines = ticks.map(t => {
      const y = PAD_TOP + chartH - (t/max)*chartH;
      return `<line x1="${PAD_L}" y1="${y}" x2="${W-PAD_R}" y2="${y}" stroke="#e5e7eb" stroke-width="1"/>
              <text x="${PAD_L-6}" y="${y+4}" text-anchor="end" font-size="9" fill="#9ca3af">${APP.privacy?'•••':(t>=1000?F(t/1000,0)+'rb':F(t))}</text>`;
    }).join('');

    const bars = monthly.map((v, i) => {
      const x = PAD_L + gap*i + gap/2 - barW/2;
      const bh = max > 0 ? (v/max)*chartH : 0;
      const y = PAD_TOP + chartH - bh;
      const label = (v > 0 && !APP.privacy) ? `<text x="${x+barW/2}" y="${y-4}" text-anchor="middle" font-size="8" fill="${color}" font-weight="600">${v>=1000?F(v/1000,1)+'rb':F(v)}</text>` : '';
      return `<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="2" fill="${color}" opacity="0.85"/>
              ${label}
              <text x="${PAD_L+gap*i+gap/2}" y="${PAD_TOP+chartH+14}" text-anchor="middle" font-size="9" fill="#6b7280">${MONTHS[i]}</text>`;
    }).join('');

    return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;margin-bottom:12px">
      <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">${title} ${year}</div>
      <div style="overflow-x:auto">
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;display:block">
        ${yLines}
        ${bars}
        <line x1="${PAD_L}" y1="${PAD_TOP}" x2="${PAD_L}" y2="${PAD_TOP+chartH}" stroke="#d1d5db" stroke-width="1"/>
        <line x1="${PAD_L}" y1="${PAD_TOP+chartH}" x2="${W-PAD_R}" y2="${PAD_TOP+chartH}" stroke="#d1d5db" stroke-width="1"/>
      </svg>
      </div>
    </div>`;
  }

  return `
  ${vSetupBanner()}
  <div class="kurs-bar">
    <span class="kurs-label">Kurs USD/IDR</span>
    <span class="kurs-value">Rp ${F(APP.data.kurs)}</span>
    <button class="btn btn-sm" onclick="openModal('kurs')">✏️ Update</button>
  </div>
  <div class="metric-grid">
    <div class="metric-card"><div class="metric-label">Total Investasi</div><div class="metric-value">${Rp(R(tot))}</div><div class="metric-sub">6 aset aktif</div></div>
    <div class="metric-card"><div class="metric-label">Dana Darurat</div><div class="metric-value">${Rp(R(td))}</div><div class="metric-sub">Liquid</div></div>
    <div class="metric-card"><div class="metric-label">Grand Total</div><div class="metric-value">${Rp(R(tot+td))}</div><div class="metric-sub">Semua aset</div></div>
    <div class="metric-card"><div class="metric-label">Dividen BEI (YTD)</div><div class="metric-value pos">${Rp(R(tDivBei()))}</div></div>
    <div class="metric-card"><div class="metric-label">Dividen US (YTD)</div><div class="metric-value pos">${Rp(R(tDivEtf()))}</div></div>
  </div>
  <div class="dashboard-grid">
    <div class="donut-container">
      <div class="donut-title">Alokasi Portofolio</div>
      <div class="donut-wrap">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle cx="48" cy="48" r="38" fill="none" stroke="#e5e7eb" stroke-width="18"/>

// ── FILTER PERIODE DIVIDEN ────────────────────────────────
// Pilihan periode diingat per browser (bukan disimpan ke Firestore)
APP.divFilter = (() => {
  try { const v = JSON.parse(localStorage.getItem('pt_div_filter')); if (v && v.preset) return v; } catch(e) {}
  return {preset:'ytd', from:'', to:''}; // default: 1 Jan tahun ini s.d. hari ini
})();
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function divRange() {
  const f = APP.divFilter;
  if (f.preset === 'custom' && f.from && f.to) return {from:f.from, to:f.to};
  if (f.preset !== '1m' && f.preset !== '3m') { const t = new Date(); return {from:`${t.getFullYear()}-01-01`, to:ymd(t)}; }
  const months = f.preset === '1m' ? 1 : 3;
  const to = new Date(), from = new Date();
  from.setMonth(from.getMonth() - months);
  return {from:ymd(from), to:ymd(to)};
}
function saveDivFilter() {
  try { localStorage.setItem('pt_div_filter', JSON.stringify(APP.divFilter)); } catch(e) {}
}
function setDivPreset(p) {
  if (p === 'custom') {
    const r = divRange();
    APP.divFilter = {preset:'custom', from:r.from, to:r.to};
  } else {
    APP.divFilter = {preset:p, from:'', to:''};
  }
  saveDivFilter();
  render();
  if (p === 'custom') { const el = document.getElementById('div-from'); if (el) el.focus(); }
}
function applyDivCustom() {
  let from = document.getElementById('div-from').value, to = document.getElementById('div-to').value;
  if (!from || !to) { alert('Isi tanggal awal dan akhir dulu.'); return; }
  if (from > to) [from, to] = [to, from];
  APP.divFilter = {preset:'custom', from, to};
  saveDivFilter();
  render();
}
function fmtTglPendek(iso) {
  const B = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agt','Sep','Okt','Nov','Des'];
  const [y,m,d] = iso.split('-');
  return `${+d} ${B[+m-1]} ${y}`;
}

function vDiv() {
  const k = APP.data.kurs;
  const {from, to} = divRange();
  const inRange = d => d.tgl && d.tgl >= from && d.tgl <= to;
  // simpan index asli supaya tombol hapus tetap menghapus baris yang benar
  const pick = arr => (arr||[]).map((d,i)=>({d,i})).filter(x=>inRange(x.d)).sort((a,b)=>a.d.tgl<b.d.tgl?-1:a.d.tgl>b.d.tgl?1:0);
  const bei = pick(APP.data.divBei), etf = pick(APP.data.divEtf);
  const tBei = bei.reduce((a,x)=>a+(x.d.bruto||0),0);
  const tEtfUsd = etf.reduce((a,x)=>a+(x.d.bruto||0),0), tEtf = tEtfUsd*k;
  const periode = `${fmtTglPendek(from)} – ${fmtTglPendek(to)}`;
  const P = APP.divFilter.preset;
  const empty = cols => `<tr><td colspan="${cols}" style="text-align:center;color:var(--text3);padding:22px">Tidak ada dividen pada periode ini</td></tr>`;
  return `

// ── ATURAN DANA DARURAT ──────────────────────────────────
// Aturan: Bank maks 65% (kuning mulai 60%), USD maks 10% (total semua item USD),
// sisanya RDPU dibagi rata (tiap RDPU dibandingkan dengan rata-rata RDPU).
const DANA_JENIS = {
  bank: {l:'Bank / Cash', s:'Bank',  max:65, warn:60, c:'#185FA5', bg:'#EFF6FF'},
  rdpu: {l:'RDPU',        s:'RDPU',  rata:true,       c:'#7C3AED', bg:'#F5F3FF'},
  usd:  {l:'USD / Valas', s:'USD',   max:10, warn:9,  c:'#3B6D11', bg:'#F0FDF4', group:true},
};
const RDPU_TOLERANSI = 0.2; // ±20% dari rata-rata RDPU masih dianggap seimbang
const DANA_JENIS_OPTS = [
  {v:'',     l:'Otomatis (dari nama)'},
  {v:'bank', l:'Bank / Cash'},
  {v:'rdpu', l:'RDPU / Pasar Uang'},
  {v:'usd',  l:'USD / Valas'},
];
function danaJenis(d) {
  if (d.jenis && DANA_JENIS[d.jenis]) return d.jenis;
  const n = (d.item||'').toLowerCase();
  if (/\busd\b|dolar|dollar|valas/.test(n)) return 'usd';
  if (/rdpu|reksa|pasar uang|money market/.test(n)) return 'rdpu';
  return 'bank';
}
const fPct = v => F(v, 1) + '%';

function vDana() {
  const dd=APP.data.dana||[], gl=APP.data.goals||[];
  const tM=dd.reduce((a,r)=>a+r.masuk,0), tV=tDana();
  const rows = dd.map((d,i) => {
    const now = d.now||d.masuk||0;
    return {d, i, now, jenis:danaJenis(d), pct: tV>0 ? now/tV*100 : 0};
  });
  const sumJenis = j => rows.filter(r=>r.jenis===j).reduce((a,r)=>a+r.pct,0);
  const grp = {bank:sumJenis('bank'), rdpu:sumJenis('rdpu'), usd:sumJenis('usd')};
  const rdpuRows = rows.filter(r=>r.jenis==='rdpu');
  const rdpuAvgPct = rdpuRows.length ? grp.rdpu / rdpuRows.length : 0; // target rata per RDPU
  rows.forEach(r => {
    const J = DANA_JENIS[r.jenis];
    if (J.rata) {
      const dev = rdpuAvgPct > 0 ? (r.pct - rdpuAvgPct) / rdpuAvgPct : 0;
      r.status = rdpuRows.length < 2 ? 'ok' : dev > RDPU_TOLERANSI ? 'above' : dev < -RDPU_TOLERANSI ? 'below' : 'ok';
      return;
    }
    const cmp = J.group ? grp[r.jenis] : r.pct;
    r.status = cmp > J.max ? 'over' : cmp >= J.warn ? 'near' : 'ok';
  });
  const ST = {
    ok:    {t:'✅ Aman',               c:'var(--green)', bar:'var(--green)'},
    near:  {t:'⚠️ Mendekati batas',    c:'var(--amber)', bar:'var(--amber)'},
    over:  {t:'⛔ Lewat batas',         c:'var(--red)',   bar:'var(--red)'},
    above: {t:'⚠️ Di atas rata-rata',  c:'var(--amber)', bar:'var(--amber)'},
    below: {t:'⬇️ Di bawah rata-rata', c:'var(--blue)',  bar:'var(--blue)'},
  };
  const stOf = r => (r.jenis==='rdpu' && r.status==='ok') ? {...ST.ok, t:'✅ Seimbang'} : ST[r.status];
  const porsiCell = r => {
    const J = DANA_JENIS[r.jenis], st = stOf(r);
    const mark = J.rata ? rdpuAvgPct : J.max;
    const ket = J.rata ? `rata-rata ${fPct(rdpuAvgPct)}` : `maks ${J.max}%${J.group&&rows.filter(x=>x.jenis===r.jenis).length>1?' (total)':''}`;
    return `<div style="display:flex;align-items:center;gap:8px">
      <b style="min-width:46px;color:${st.c}">${fPct(r.pct)}</b>
      <div style="position:relative;width:90px;height:6px;background:var(--bg3);border-radius:3px">
        <div style="width:${Math.min(100,r.pct)}%;height:6px;border-radius:3px;background:${st.bar}"></div>
        <div style="position:absolute;top:-3px;left:${Math.min(100,mark)}%;width:2px;height:12px;background:var(--text3);border-radius:1px" title="${ket}"></div>
      </div>
      <span style="font-size:11px;color:var(--text3)">${ket}</span>
    </div>`;
  };

  // ── saran setoran berikutnya
  const saran = [];
  if (tV > 0 && rows.length) {
    const sudah = new Set();
    rows.filter(r=>r.status==='over').forEach(r => {
      const J = DANA_JENIS[r.jenis];
      if (J.group) {
        if (sudah.has(r.jenis)) return; sudah.add(r.jenis);
        const nilai = rows.filter(x=>x.jenis===r.jenis).reduce((a,x)=>a+x.now,0);
        saran.push(`⛔ <b>${J.l}</b> ${fPct(grp[r.jenis])}, di atas batas ${J.max}% (lebih ${Rp(R(nilai - J.max/100*tV))}). Jangan tambah dulu.`);
      } else {
        saran.push(`⛔ <b>${r.d.item}</b> ${fPct(r.pct)}, di atas batas ${J.max}% (lebih ${Rp(R(r.now - J.max/100*tV))}). Jangan tambah dulu.`);
      }
    });
    const banks = rows.filter(r=>r.jenis==='bank');
    const rdpuKecil = [...rdpuRows].sort((a,b)=>a.now-b.now)[0];
    const bankNames = banks.map(r=>r.d.item).join(' / ');
    const rdpuAtas = rdpuRows.filter(r=>r.status==='above').map(r=>r.d.item);
    const catatanRata = rdpuAtas.length ? ` (${rdpuAtas.join(', ')} sedang di atas rata-rata, tidak perlu dipindah)` : '';
    if (banks.length && grp.bank < DANA_JENIS.bank.warn && !banks.some(r=>r.status==='over')) {
      saran.push(`👉 Setoran berikutnya ke <b>${bankNames}</b>: porsinya ${fPct(grp.bank)}, masih di bawah ${DANA_JENIS.bank.warn}%.`);
      if (rdpuKecil && rdpuRows.length > 1) saran.push(`↳ Kalau mau setor ke RDPU, pilih <b>${rdpuKecil.d.item}</b> (paling kecil, ${fPct(rdpuKecil.pct)}) supaya RDPU makin rata${catatanRata}.`);
    } else if (rdpuKecil) {
      saran.push(`👉 Setoran berikutnya ke <b>${rdpuKecil.d.item}</b>: RDPU paling kecil (${fPct(rdpuKecil.pct)}), supaya RDPU makin rata${catatanRata}.`);
    } else if (banks.length) {
      saran.push(`👉 Setoran berikutnya ke <b>${bankNames}</b>.`);
    }
    const usdNilai = rows.filter(r=>r.jenis==='usd').reduce((a,r)=>a+r.now,0);
    const ruangUsd = DANA_JENIS.usd.max/100*tV - usdNilai;
    if (rows.some(r=>r.jenis==='usd') && ruangUsd > 0) {
      saran.push(`💵 USD masih bisa ditambah sekitar ${Rp(R(ruangUsd))} (sampai ${DANA_JENIS.usd.max}%), dibeli dari porsi cash saat kurs sedang turun.`);
    }
  }

  // ── komposisi (stacked bar)
  const shade = (hex, k, n) => n<=1 ? hex : hexA(hex, 1 - k*(0.55/(n-1)));
  const byJenis = j => rows.filter(r=>r.jenis===j);
  const segs = ['bank','rdpu','usd'].flatMap(j => byJenis(j).map((r,k,arr)=>({...r, col:shade(DANA_JENIS[j].c,k,arr.length)})));
  const komposisi = tV>0 && rows.length ? `
  <div class="donut-container" style="margin-top:12px">
    <div class="donut-title" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <span>Komposisi Dana Darurat</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap">${['bank','rdpu','usd'].filter(j=>byJenis(j).length).map(j=>{
        const J=DANA_JENIS[j]; const v=grp[j];
        const st = byJenis(j).some(r=>r.status==='over')?'over':byJenis(j).some(r=>r.status==='near'||r.status==='above')?'near':'ok';
        const ket = J.rata ? `dibagi rata${byJenis(j).length>1?' ('+byJenis(j).length+' item)':''}` : `maks ${J.max}%`;
        return `<span class="badge" style="background:${J.bg};color:${J.c};font-size:11px">${J.s} ${fPct(v)} <span style="color:${ST[st].c};margin-left:4px">· ${ket}</span></span>`;
      }).join('')}</span>
    </div>
    <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bg3);margin:4px 0 10px">
      ${segs.map(r=>`<div title="${r.d.item} ${fPct(r.pct)}" style="width:${r.pct}%;background:${r.col}"></div>`).join('')}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:12px">
      ${segs.map(r=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px"><span class="legend-dot" style="background:${r.col}"></span>${r.d.item} <b>${fPct(r.pct)}</b></span>`).join('')}
    </div>
    ${saran.length ? `<div style="border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:6px;font-size:12.5px">${saran.map(t=>`<div>${t}</div>`).join('')}</div>` : ''}
    <details style="margin-top:10px;font-size:12px;color:var(--text2)">
      <summary style="cursor:pointer;font-weight:600">Aturan yang dipakai</summary>
      <ul style="margin:8px 0 0 18px;line-height:1.7">
        <li>Bank / cash (Krom) tidak lebih dari ${DANA_JENIS.bank.max}% (kuning mulai ${DANA_JENIS.bank.warn}%). Kalau sudah penuh, setoran berikutnya ke RDPU.</li>
        <li>USD tidak lebih dari ${DANA_JENIS.usd.max}%, dan dibeli dari porsi cash saat kurs sedang turun.</li>
        <li>Sisanya RDPU dibagi rata. RDPU yang selisihnya masih dalam ±${RDPU_TOLERANSI*100}% dari rata-rata dianggap seimbang; meratakannya cukup lewat setoran berikutnya ke RDPU yang paling kecil.</li>
        <li>Kalau bunga Krom turun jauh di bawah 6% (misalnya mendekati imbal hasil RDPU), tinjau ulang.</li>
        <li>Jenis tiap item dibaca otomatis dari namanya (RDPU, USD, selain itu dianggap bank). Bisa diubah lewat ✏️ Edit.</li>
      </ul>
    </details>
  </div>` : '';

  return `
  <div class="section-header"><span class="section-title">🛡 Dana Darurat</span><button class="btn btn-success btn-sm" onclick="openModal('dana')">+ Tambah</button></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Item</th><th>Jenis</th><th>Modal Masuk</th><th>Nilai Sekarang</th><th>Keuntungan</th><th>Porsi</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows.map(r=>{ const d=r.d, i=r.i, J=DANA_JENIS[r.jenis]; return `<tr>
      <td>${d.item}</td>
      <td><span class="badge" style="font-size:10px;background:${J.bg};color:${J.c}">${J.s}</span></td>
      <td>${Rp(d.masuk)}</td>
      <td>${APP.privacy?Rp(0):`<input class="cell-input" style="width:120px" type="number" value="${d.now||d.masuk}" onchange="upd('dana',${i},'now',+this.value)">`}</td>
      <td class="${Cls((d.now||d.masuk)-d.masuk)}">${Rp(R((d.now||d.masuk)-d.masuk))}</td>
      <td>${porsiCell(r)}</td>
      <td><span style="font-size:12px;font-weight:600;color:${stOf(r).c}">${stOf(r).t}</span></td>
      <td><div class="row-actions"><button class="btn btn-icon-edit" title="Edit" onclick="openEdit('dana',${i})">✏️</button><button class="btn btn-icon" onclick="del('dana',${i})">🗑</button></div></td>
    </tr>`;}).join('')}</tbody>
    <tfoot><tr class="tr-total"><td colspan="2">TOTAL</td><td>${Rp(R(tM))}</td><td>${Rp(R(tV))}</td><td class="${Cls(tV-tM)}">${Rp(R(tV-tM))}</td><td>${tV>0?'<b>100%</b>':''}</td><td colspan="2"></td></tr></tfoot>
  </table></div>
  ${komposisi}
  <div class="section-header" style="margin-top:16px"><span class="section-title">🎯 Goals Keuangan</span><button class="btn btn-success btn-sm" onclick="openModal('goals')">+ Tambah</button></div>
  ${gl.map((g,i)=>{
    const p = g.target > 0 ? Math.min(100, g.terkumpul/g.target*100) : 0;
    const sisa = (g.target||0) - (g.terkumpul||0);
    const sisaLabel = sisa > 0
      ? `<span style="color:var(--red);font-size:12px;font-weight:600">Kurang: ${Rp(R(sisa))}</span>`
      : `<span style="color:var(--green);font-size:12px;font-weight:600">✅ Target tercapai!</span>`;
    return `<div class="goal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong>${g.nama}</strong>
        <div style="display:flex;gap:8px;align-items:center"><span class="badge badge-blue">${g.deadline}</span><button class="btn btn-icon-edit" title="Edit" onclick="openEdit('goals',${i})">✏️</button><button class="btn btn-icon" onclick="del('goals',${i})">🗑</button></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px">
        <span>Terkumpul: <b style="color:var(--text)">${Rp(g.terkumpul)}</b></span>
        <span>Target: <b style="color:var(--text)">${Rp(g.target)}</b></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${p}%;background:${p>=100?'var(--green)':'var(--blue)'}"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:5px">
        ${sisaLabel}
        <span style="font-size:12px;color:var(--text2);font-weight:600">${F(p,1)}%</span>
      </div>
    </div>`;
  }).join('')}
  ${gl.length > 0 ? `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px 16px;margin-top:8px;display:flex;justify-content:space-between;align-items:center">
    <span style="font-weight:600;font-size:13px">TOTAL TERKUMPUL</span>
    <div style="display:flex;gap:24px;align-items:center">
      <span style="font-size:12px;color:var(--text2)">Target: <b style="color:var(--text)">${Rp(R(gl.reduce((a,g)=>a+(g.target||0),0)))}</b></span>
      <span style="font-size:12px;color:var(--text2)">Terkumpul: <b style="color:var(--green)">${Rp(R(gl.reduce((a,g)=>a+(g.terkumpul||0),0)))}</b></span>
      <span style="font-size:12px;color:var(--red);font-weight:600">Kurang: ${Rp(R(gl.reduce((a,g)=>a+Math.max(0,(g.target||0)-(g.terkumpul||0)),0)))}</b></span>
    </div>
  </div>` : ''}`;
}

function vObligasi() {
  const ob = APP.data.obligasi||[];
  const tNominal = ob.reduce((a,r)=>a+getNilaiNominal(r),0);
  const tBunga   = ob.reduce((a,r)=>a+hitungBungaAkrual(r),0);
  const tTotal   = tNominal + tBunga;
  const tModal   = ob.reduce((a,r)=>a+getModalBeli(r),0);
  const tPL      = tTotal - tModal;
  return `
  <div class="section-header"><span class="section-title">🏦 Obligasi / SBN</span><button class="btn btn-success btn-sm" onclick="openModal('obligasi')">+ Tambah</button></div>
  <div class="metric-grid" style="grid-template-columns:repeat(4,1fr)">

function ensureCompoundDefaults(tot) {
  if (!APP.data.compound) {
    const totVal = (typeof tot === 'number') ? tot : (tSaham()+tEtf()+tEmas()+tBtc()+tRdana()+tObligasi());
    APP.data.compound = { modalAwal: R(totVal), kontribusi: 0, returnPct: 8, tahun: 10 };
  }
}

function updCompound(field, val) {
  ensureCompoundDefaults();
  APP.data.compound[field] = val;
  APP.compoundAutoMsg = null;
  scheduleSave();
  render();
}

function syncModalAwalCompound() {
  ensureCompoundDefaults();
  const tot = tSaham()+tEtf()+tEmas()+tBtc()+tRdana()+tObligasi();

// Estimasi return tahunan blended, berdasarkan data histori portofolio yang sudah ada
// (tanggal beli & modal vs nilai kini) di Saham BEI, US, Emas, Crypto, dan Obligasi.
function computeAutoReturn() {
  const today = new Date();
  let totalModal = 0, totalNilai = 0, weightedDaysNum = 0;
  function addItem(tglStr, modal, nilai) {
    if (!tglStr || !(modal > 0)) return;
    const tgl = new Date(tglStr);
    if (isNaN(tgl.getTime())) return;
    const days = Math.floor((today - tgl) / (1000*60*60*24));
    if (days <= 0) return;
    totalModal += modal;
    totalNilai += nilai;
    weightedDaysNum += modal * days;
  }
  cSaham().forEach(s => addItem(s.tgl, s.m, s.v));
  cEtf().forEach(e => addItem(e.tgl, e.mi, e.vi));
  cEmas().forEach(e => addItem(e.tgl, e.m, e.v));
  cBtc().forEach(b => addItem(b.tgl, b.m, b.v));
  (APP.data.obligasi||[]).forEach(r => {
    const modal = getModalBeli(r), nominal = getNilaiNominal(r), bunga = hitungBungaAkrual(r);
    addItem(r.tgl, modal, nominal + bunga);
  });
  if (totalModal <= 0 || weightedDaysNum <= 0) return null;
  const avgDays = weightedDaysNum / totalModal;
  const totalReturn = (totalNilai - totalModal) / totalModal;
  const base = 1 + totalReturn;
  if (base <= 0) return { rate: null, avgDays, totalModal, totalNilai, totalReturn };
  const annualized = Math.pow(base, 365/avgDays) - 1;
  return { rate: annualized, avgDays, totalModal, totalNilai, totalReturn };
}

function autoReturnCompound() {
  ensureCompoundDefaults();
  const res = computeAutoReturn();
  if (!res || res.rate === null) {
    APP.compoundAutoMsg = '⚠️ Data belum cukup untuk menghitung otomatis (butuh tanggal beli & modal pada Saham BEI/US/Emas/Crypto/Obligasi). Silakan isi return manual.';
  } else {
    APP.data.compound.returnPct = Math.round(res.rate*1000)/10;
    APP.compoundAutoMsg = `✅ Terisi ${Pct(res.rate)}/tahun — dihitung dari return total ${Pct(res.totalReturn)} selama rata-rata ${Math.round(res.avgDays)} hari (~${(res.avgDays/365).toFixed(1)} th) masa pegang seluruh Saham BEI, US, Emas, Crypto & Obligasi yang tercatat tanggal belinya. Angka ini murni histori portofolio kamu sendiri, bukan proyeksi pasar — silakan sesuaikan manual bila perlu.`;
    scheduleSave();
  }
  render();
}

// Simulasi bulanan: kontribusi ditambahkan di awal bulan, lalu seluruh saldo tumbuh sebesar return bulan itu
function simulateCompounding(modalAwal, kontribusiBulanan, returnPctAnnual, tahun) {
  const rAnnual = returnPctAnnual/100;
  const rMonthly = Math.pow(1+rAnnual, 1/12) - 1;
  const months = Math.max(1, Math.round(tahun*12));
  let balance = modalAwal, totalSetor = modalAwal;
  const yearly = [];
  for (let m=1; m<=months; m++) {
    balance = (balance + kontribusiBulanan) * (1+rMonthly);
    totalSetor += kontribusiBulanan;
    if (m % 12 === 0 || m === months) {
      yearly.push({ tahunKe: Math.round(m/12*10)/10, totalSetor, nilai: balance, growth: balance-totalSetor });
    }
  }
  return yearly;
}

function fAxisRp(v) {
  if (v >= 1e9) return F(v/1e9,2)+'M';
  if (v >= 1e6) return F(v/1e6,1)+'jt';
  if (v >= 1e3) return F(v/1e3,0)+'rb';
  return F(v);
}

function lineChartCompound(yearly, modalAwal) {
  const W=600, H=220, PAD_L=64, PAD_R=16, PAD_TOP=16, PAD_BOT=28;
  const chartW=W-PAD_L-PAD_R, chartH=H-PAD_TOP-PAD_BOT;
  const points = [{tahunKe:0, totalSetor:modalAwal, nilai:modalAwal}, ...yearly];
  const n = points.length-1 || 1;
  const maxVal = Math.max(...points.map(p=>p.nilai), 1);
  const xAt = i => PAD_L + (chartW*i/n);
  const yAt = v => PAD_TOP + chartH - Math.max(0,Math.min(1,v/maxVal))*chartH;
  const nilaiPath = points.map((p,i)=>`${i===0?'M':'L'} ${xAt(i).toFixed(1)} ${yAt(p.nilai).toFixed(1)}`).join(' ');
  const setorPath = points.map((p,i)=>`${i===0?'M':'L'} ${xAt(i).toFixed(1)} ${yAt(p.totalSetor).toFixed(1)}`).join(' ');
  const ticks=[0, maxVal/2, maxVal];
  const yLines = ticks.map(t=>{
    const y=yAt(t);
    return `<line x1="${PAD_L}" y1="${y.toFixed(1)}" x2="${W-PAD_R}" y2="${y.toFixed(1)}" stroke="#e5e7eb" stroke-width="1"/><text x="${PAD_L-6}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="9" fill="#9ca3af">${APP.privacy?'•••':fAxisRp(t)}</text>`;
  }).join('');
  const step = n > 12 ? Math.ceil(n/12) : 1;
  const xLabels = points.map((p,i)=>({p,i})).filter(({i})=>i%step===0||i===n)
    .map(({p,i})=>`<text x="${xAt(i).toFixed(1)}" y="${PAD_TOP+chartH+16}" text-anchor="middle" font-size="9" fill="#6b7280">${i===0?'Now':'Th '+p.tahunKe}</text>`).join('');
  return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px 16px;margin-bottom:16px">
    <div style="font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px">📈 Grafik Pertumbuhan</div>
    <div style="overflow-x:auto">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;max-height:340px;display:block">
      ${yLines}
      <path d="${setorPath}" fill="none" stroke="#9ca3af" stroke-width="1.75" stroke-dasharray="4 3"/>
      <path d="${nilaiPath}" fill="none" stroke="#185FA5" stroke-width="2.5"/>
      <line x1="${PAD_L}" y1="${PAD_TOP}" x2="${PAD_L}" y2="${PAD_TOP+chartH}" stroke="#d1d5db" stroke-width="1"/>
      <line x1="${PAD_L}" y1="${PAD_TOP+chartH}" x2="${W-PAD_R}" y2="${PAD_TOP+chartH}" stroke="#d1d5db" stroke-width="1"/>
      ${xLabels}
    </svg>
    </div>
    <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--text2)">
      <span><span style="display:inline-block;width:14px;height:2px;background:#185FA5;vertical-align:middle;margin-right:4px"></span>Nilai Portfolio</span>
      <span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed #9ca3af;vertical-align:middle;margin-right:4px"></span>Total Disetor</span>
    </div>
  </div>`;
}

// ── AUTO UPDATE HARGA SAHAM ───────────────────────────────
// Yahoo Finance tidak kirim header CORS, jadi browser butuh proxy publik utk baca hasilnya.
// Dicoba berurutan — kalau satu proxy lagi down/berbayar/limit, otomatis lanjut ke proxy berikutnya.
// Catatan: ini semua layanan gratis pihak ketiga di luar kendali kita, jadi bisa saja
// berhenti berfungsi lagi kapan pun (persis yang terjadi pada corsproxy.io & allorigins sebelumnya).
// Kalau semua proxy di bawah suatu saat mati bareng, isi harga manual di kolom "Hrg Kini" tetap bisa dipakai.
// ── CLOUDFLARE WORKER PROXY (stabil, milik sendiri) ──────
const CF_WORKER = 'https://yahoo-proxy.indraanggriawan17.workers.dev';

// Worker dipakai bersama aplikasi lain, jadi formatnya bisa berubah.
// Dicoba format baru (?url=, proxy universal) dulu, lalu format lama (?symbol=) sebagai cadangan.
async function fetchYahooPrice(symbol) {
  const yUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=1d`;
  try {
    const res = await fetch(`${CF_WORKER}/?url=${encodeURIComponent(yUrl)}`, {signal: AbortSignal.timeout(8000)});
    if (res.ok) {
      const data = await res.json();
      const price = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
      if (price > 0) return price;
    }
  } catch(e) {}
  try {
    const res = await fetch(`${CF_WORKER}/?symbol=${encodeURIComponent(symbol)}`, {signal: AbortSignal.timeout(8000)});
    if (res.ok) {
      const data = await res.json();
      if (data.price > 0) return data.price;
    }
  } catch(e) {}
  return null;
}

async function fetchHargaSaham(kode) {
  const price = await fetchYahooPrice(kode + '.JK');
  return price ? Math.round(price) : null;
}

async function updateHargaOtomatis() {
  const saham = APP.data.saham;
  if (!saham || saham.length === 0) return;

  const btn = document.getElementById('btnUpdateHarga');
  const statusEl = document.getElementById('updateStatus');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Mengambil...'; }
  if (statusEl) {
    statusEl.innerHTML = '⏳ Mengambil harga semua saham...';
    statusEl.style.cssText = 'display:block;font-size:11px;padding:6px 10px;margin-bottom:6px;border-radius:6px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af';
  }

  const kodes = [...new Set(saham.map(s => s.kode.toUpperCase()))];

  // Batch per 4 supaya tidak overload proxy
  let berhasil = 0, gagal = [];
  const batchSize = 6;
  for (let i = 0; i < kodes.length; i += batchSize) {
    const batch = kodes.slice(i, i + batchSize);
    const results = await Promise.allSettled(batch.map(k => fetchHargaSaham(k)));
    results.forEach((r, idx) => {
      const kode = batch[idx];
      const price = r.status === 'fulfilled' ? r.value : null;
      if (price) {
        saham.forEach((s, si) => {
          if (s.kode.toUpperCase() === kode) APP.data.saham[si].now = price;
        });
        berhasil++;
        if (statusEl) statusEl.textContent = `⏳ ${kode}: Rp ${F(price)} (${berhasil}/${kodes.length})`;
      } else {
        gagal.push(kode);
      }
    });
    if (i + batchSize < kodes.length) await new Promise(r => setTimeout(r, 300));
  }

  scheduleSave();
  render();

  const el = document.getElementById('updateStatus');
  if (el) {
    const semua = kodes.length;
    const isOk = gagal.length === 0;
    const isPartial = berhasil > 0 && gagal.length > 0;
    const isFail = berhasil === 0;
    let icon = isOk ? '✅' : isPartial ? '⚠️' : '❌';
    let bg = isOk ? '#f0fdf4' : isPartial ? '#fffbeb' : '#fef2f2';
    let border = isOk ? '#bbf7d0' : isPartial ? '#fde68a' : '#fecaca';
    let color = isOk ? '#065f46' : isPartial ? '#92400e' : '#991b1b';
    let msg = `${icon} <b>${berhasil}/${semua} saham berhasil diupdate</b>`;
    if (gagal.length > 0) msg += ` &nbsp;|&nbsp; ⚠️ Gagal: <b>${gagal.join(', ')}</b>`;
    msg += ` &nbsp;—&nbsp; ${new Date().toLocaleTimeString('id-ID')}`;
    el.innerHTML = msg;
    el.style.cssText = `display:block;font-size:11px;padding:6px 10px;margin-bottom:6px;border-radius:6px;background:${bg};border:1px solid ${border};color:${color}`;
  }
  const b = document.getElementById('btnUpdateHarga');
  if (b) { b.disabled = false; b.textContent = '🔄 Update Harga'; }
}

function getSektorKey(sektor, kode) {
  if (kode) { const m = EMITEN_SEKTOR[kode.toUpperCase()]; if (m) return m; }
  if (!sektor) return 'default';
  const s = sektor.toLowerCase();
  if (s.includes('bank') || s.includes('keuang')) return 'bank';
  if (s.includes('energi') || s.includes('minyak') || s.includes('gas')) return 'energi';
  if (s.includes('tambang') || s.includes('mining') || s.includes('nikel')) return 'tambang';
  if (s.includes('consumer') || s.includes('fmcg') || s.includes('makanan')) return 'consumer';
  if (s.includes('retail') || s.includes('ritel')) return 'retail';
  if (s.includes('proper')) return 'property';
  if (s.includes('teleko') || s.includes('telecom')) return 'telecom';
  if (s.includes('infra') || s.includes('konstruk')) return 'infrastr';
  if (s.includes('tech') || s.includes('digital')) return 'tech';
  if (s.includes('agri') || s.includes('sawit') || s.includes('kebun')) return 'agri';
  if (s.includes('health') || s.includes('farma')) return 'health';
  if (s.includes('media')) return 'media';
  return 'default';
}

function hitungWajar(s) {
  const eps      = s.eps      || 0;
  const pbvRatio = s.pbvRatio || 0;
  const hargaKini = s.now     || 0;

  if (eps <= 0 && pbvRatio <= 0) return {wb:0, wa:0};

  // BV dihitung otomatis: Harga Kini ÷ PBV Ratio
  const bv = (pbvRatio > 0 && hargaKini > 0) ? hargaKini / pbvRatio : 0;

  const key = getSektorKey(s.sektor, s.kode);
  const m   = SEKTOR_MULTIPLE[key] || SEKTOR_MULTIPLE['default'];

  let wb, wa;
  if (eps > 0 && bv > 0) {
    wb = Math.round((eps * m.perMin + bv * m.pbvMin) / 2);
    wa = Math.round((eps * m.perMax + bv * m.pbvMax) / 2);
  } else if (eps > 0) {
    wb = Math.round(eps * m.perMin);
    wa = Math.round(eps * m.perMax);
  } else {
    wb = Math.round(bv * m.pbvMin);
    wa = Math.round(bv * m.pbvMax);
  }
  return {wb, wa};
}

function hitungWajarSemua() {
  const saham = APP.data.saham;
  if (!saham || saham.length === 0) return;
  let updated = 0, skip = 0;
  saham.forEach((s, i) => {
    if ((s.eps||0) <= 0 && (s.pbvRatio||0) <= 0) { skip++; return; }
    const {wb, wa} = hitungWajar(s);
    if (wb > 0 && wa > 0) {
      APP.data.saham[i].wajarBawah = wb;
      APP.data.saham[i].wajarAtas  = wa;
      updated++;
    }
  });
  scheduleSave();
  render();
  const el = document.getElementById('updateStatus');
  if (el) {
    let msg = `🧮 ${updated} saham berhasil dihitung harga wajarnya`;
    if (skip > 0) msg += ` | ⚠️ ${skip} saham belum ada EPS/BV — isi via ✏️ Edit`;
    el.textContent = msg;
    el.style.display = 'block';
  }
}

async function fetchHargaEtf(kode) {
  return await fetchYahooPrice(kode);
}

async function updateHargaEtf() {
  const etf = APP.data.etf;
  if (!etf || etf.length === 0) return;

  const btn = document.getElementById('btnUpdateEtf');
  const statusEl = document.getElementById('updateStatusEtf');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Mengambil...'; }
  if (statusEl) {
    statusEl.innerHTML = '⏳ Mengambil harga US/ETF...';
    statusEl.style.cssText = 'display:block;font-size:11px;padding:6px 10px;margin-bottom:6px;border-radius:6px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af';
  }

  const kodes = [...new Set(etf.map(e => e.kode.toUpperCase()))];
  let berhasil = 0, gagal = [];
  const batchSize = 4;

  for (let i = 0; i < kodes.length; i += batchSize) {
    const batch = kodes.slice(i, i + batchSize);
    const results = await Promise.allSettled(batch.map(kode => fetchHargaEtf(kode)));

    results.forEach((r, idx) => {
      const kode = batch[idx];
      const price = r.status === 'fulfilled' ? r.value : null;
      if (price) {
        etf.forEach((e, ei) => {
          if (e.kode.toUpperCase() === kode) APP.data.etf[ei].now = parseFloat(price.toFixed(2));
        });
        berhasil++;
        if (statusEl) statusEl.textContent = `⏳ ${kode}: $${price.toFixed(2)} (${berhasil}/${kodes.length})`;
      } else {
        gagal.push(kode);
      }
    });
    if (i + batchSize < kodes.length) await new Promise(r => setTimeout(r, 600));
  }

  scheduleSave();
  render();

  const el = document.getElementById('updateStatusEtf');
  if (el) {
    const semua = kodes.length;
    const isOk = gagal.length === 0;
    const isPartial = berhasil > 0 && gagal.length > 0;
    let icon = isOk ? '✅' : isPartial ? '⚠️' : '❌';
    let bg = isOk ? '#f0fdf4' : isPartial ? '#fffbeb' : '#fef2f2';
    let border = isOk ? '#bbf7d0' : isPartial ? '#fde68a' : '#fecaca';
    let color = isOk ? '#065f46' : isPartial ? '#92400e' : '#991b1b';
    let msg = `${icon} <b>${berhasil}/${semua} ETF berhasil diupdate</b>`;
    if (gagal.length > 0) msg += ` &nbsp;|&nbsp; ⚠️ Gagal: <b>${gagal.join(', ')}</b>`;
    msg += ` &nbsp;—&nbsp; ${new Date().toLocaleTimeString('id-ID')}`;
    el.innerHTML = msg;
    el.style.cssText = `display:block;font-size:11px;padding:6px 10px;margin-bottom:6px;border-radius:6px;background:${bg};border:1px solid ${border};color:${color}`;
  }
  const b = document.getElementById('btnUpdateEtf');
  if (b) { b.disabled = false; b.textContent = '🔄 Update Harga'; }
}

const csvCell = v => {
  if (v === null || v === undefined) return '';
  const t = String(v);
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
};
const csvRow = arr => arr.map(csvCell).join(',');
const pct2 = (a, b) => b ? ((a / b) * 100).toFixed(2) + '%' : '';
const sumBy = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);

// Pilihan bagian diingat per browser
APP.exportSel = (() => {
  try { const v = JSON.parse(localStorage.getItem('pt_export_sel')); if (Array.isArray(v) && v.length) return v; } catch(e) {}
  return EXPORT_SECTIONS.map(x=>x.id);
})();
APP.exportOpen = false;

function openExport() { APP.exportOpen = true; render(); }
function closeExport() { APP.exportOpen = false; render(); }
function exportSelected() { return [...document.querySelectorAll('.ex-cb:checked')].map(e=>e.value); }
function exportRefresh() {
  const sel = exportSelected(), btn = document.getElementById('ex-go');
  if (btn) { btn.disabled = !sel.length; btn.textContent = sel.length ? `⬇ Export Terpilih (${sel.length})` : '⬇ Pilih minimal 1 bagian'; }
  const all = document.getElementById('ex-all');
  if (all) { const n = document.querySelectorAll('.ex-cb').length; all.checked = sel.length === n; all.indeterminate = sel.length > 0 && sel.length < n; }
}
function exportToggleAll(on) {
  document.querySelectorAll('.ex-cb').forEach(e => e.checked = on);
  exportRefresh();
}
function runExport(ids) {
  if (!ids || !ids.length) return;
  const secs = EXPORT_SECTIONS.filter(x => ids.includes(x.id));
  const semua = secs.length === EXPORT_SECTIONS.length;
  APP.exportSel = secs.map(x=>x.id);
  try { localStorage.setItem('pt_export_sel', JSON.stringify(APP.exportSel)); } catch(e) {}
  const now = new Date();
  const lines = [
    csvRow(['Portfolio Tracker Export']),
    csvRow(['Tanggal export', ymd(now) + ' ' + now.toTimeString().slice(0,5)]),
    csvRow(['Kurs USD/IDR', APP.data.kurs||17800]),
    csvRow(['Bagian', semua ? 'Semua' : secs.map(x=>x.l).join(' + ')]),
  ];
  secs.forEach(sec => {
    lines.push('', csvRow([sec.l.toUpperCase()]));
    sec.rows().forEach(r => lines.push(csvRow(r)));
  });
  const slug = semua ? '' : secs.length === 1 ? '_' + secs[0].l.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'') : '_Pilihan';
  const blob = new Blob(['﻿' + lines.join('\n') + '\n'], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Portfolio${slug}_${ymd(now)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  closeExport();
}
// dipertahankan untuk kompatibilitas: export semua bagian
function doExport() { runExport(EXPORT_SECTIONS.map(x=>x.id)); }

function vExportModal() {
  if (!APP.exportOpen || !APP.data) return '';
  const groups = [...new Set(EXPORT_SECTIONS.map(x=>x.g))];
  const sel = new Set(APP.exportSel);

  return `<div class="modal-overlay" onclick="if(event.target===this)closeExport()">
  <div class="modal-box ex-box">
    <div class="modal-title" style="margin-bottom:4px">Export CSV</div>
    <div style="font-size:12.5px;color:var(--text2);margin-bottom:14px">Pilih bagian yang mau di-export. Semua bagian yang dipilih digabung dalam 1 file CSV.</div>

}
