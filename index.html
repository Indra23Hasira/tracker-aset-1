// ── BELI BULANAN (Tahap 1) ───────────────────────────────
// Dua level: (1) dana dibagi ke kelas aset sesuai target beli per kelas,
// (2) jatah tiap kelas dibagi ke kode di dalamnya sesuai porsi (default rata),
// lalu dibulatkan ke satuan beli (lot / lembar / gram / Rp 1.000 / unit SBN).
const BB_KELAS = [
  {k:'saham',    l:'Saham BEI', c:'#185FA5'},
  {k:'etf',      l:'US',        c:'#3B6D11'},
  {k:'emas',     l:'Emas',      c:'#BA7517'},
  {k:'btc',      l:'Crypto',    c:'#A32D2D'},
  {k:'rdana',    l:'Reksadana', c:'#7C3AED'},
  {k:'obligasi', l:'Obligasi',  c:'#0891B2'},
];

const bbAttr = v => String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
function bbState() {
  if (!APP.data.beliBulanan) APP.data.beliBulanan = {};
  const S = APP.data.beliBulanan;
  if (S.dana == null) S.dana = 0;
  if (S.feeBei == null) S.feeBei = 0.15;
  if (S.feeUs == null) S.feeUs = 0;
  if (!S.frac) S.frac = '1';
  if (!S.mode) S.mode = 'rebal';
  if (!S.skipMode) S.skipMode = 'kas';
  if (!S.target) S.target = {};  // per kelas; kosong = titik tengah Target Alokasi
  if (!S.porsi) S.porsi = {};    // per kode, % di dalam kelas; kosong = dibagi rata
  if (!S.skip) S.skip = {};      // per kode, atau 'kelas:<k>'
  if (!S.mahal) S.mahal = 'lewati'; // saham ⚠️ Mahal: 'lewati' | 'kurangi' | 'beli'
  if (!S.paksa) S.paksa = {};    // per kode: tetap dibeli walau Mahal (mode lewati)
  return S;
}
function bbMid(k) {
  ensureTargetDefaults();
  const t = APP.data.targetAlokasi.kelas[k] || {min:0, max:0};
  return ((+t.min||0) + (+t.max||0)) / 2;
}
function bbTarget(k) {
  const S = bbState();
  return S.target[k] != null ? +S.target[k] : bbMid(k);
}

// Daftar kode per kelas, diambil dari holding
function bbItems() {
  // dipakai: kode Hold; kalau belum ada yang ditandai Hold, semua kode kecuali Swing
  const pick = rows => { const h = rows.filter(isHold); return h.length ? h : rows.filter(x => posisiOf(x) !== 'swing'); };
  const group = (arr, keyOf, make) => {
    const m = new Map();
    arr.forEach(x => { const k = keyOf(x); if (!m.has(k)) m.set(k, make(x)); m.get(k).rows.push(x); });
    return [...m.values()];
  };
  const out = {};

  const sh = cSaham();
  out.saham = {holdOnly: sh.some(isHold), hasAny: sh.length > 0, list: group(pick(sh), x => (x.kode||'').toUpperCase(), x => ({
    key:'saham:'+(x.kode||'').toUpperCase(), n:(x.kode||'').toUpperCase(), rows:[], kind:'lot'}))};
  out.saham.list.forEach(it => {
    it.v = it.rows.reduce((a,r)=>a+r.v,0);
    it.p = it.rows[it.rows.length-1].now || 0;
    const w = it.rows.find(r => r.wajarBawah > 0 && r.wajarAtas > 0);
    if (w && it.p) it.wajar = it.p < w.wajarBawah ? 'diskon' : it.p > w.wajarAtas ? 'mahal' : 'wajar';
  });

  const et = cEtf();
  out.etf = {holdOnly: et.some(isHold), hasAny: et.length > 0, list: group(pick(et), x => (x.kode||'').toUpperCase(), x => ({
    key:'etf:'+(x.kode||'').toUpperCase(), n:(x.kode||'').toUpperCase(), rows:[], kind:'etf'}))};
  out.etf.list.forEach(it => { it.v = it.rows.reduce((a,r)=>a+r.vi,0); it.p = it.rows[it.rows.length-1].now || 0; });

  out.emas = {list: group(cEmas(), x => (x.lokasi||'Emas')+'|'+(x.jenis||'digital'), x => ({
    key:'emas:'+(x.lokasi||'Emas')+'|'+(x.jenis||'digital'), n:`${x.lokasi||'Emas'} (${x.jenis||'digital'})`, rows:[], kind:(x.jenis==='fisik'?'gram':'rp'), est:'gram'}))};
  out.emas.list.forEach(it => { it.v = it.rows.reduce((a,r)=>a+r.v,0); it.p = it.rows[it.rows.length-1].now || 0; });

  out.btc = {list: group(cBtc(), x => (x.jenis||'BTC').toUpperCase(), x => ({
    key:'btc:'+(x.jenis||'BTC').toUpperCase(), n:(x.jenis||'BTC').toUpperCase(), rows:[], kind:'rp', est:'koin'}))};
  out.btc.list.forEach(it => { it.v = it.rows.reduce((a,r)=>a+r.v,0); it.p = it.rows[it.rows.length-1].now || 0; });

  out.rdana = {list: (APP.data.rdana||[]).map(r => ({key:'rdana:'+r.item, n:r.item, v:(r.now||r.masuk||0), kind:'rp'}))};

  // SBN dibeli per seri yang sedang ditawarkan, jadi cukup satu baris untuk kelasnya
  out.obligasi = {list: [{key:'obligasi:_sbn', n:'SBN seri yang sedang ditawarkan', v:tObligasi(), kind:'sbn'}]};

  // kelas tanpa holding tapi punya target → satu baris "pilih produk"
  ['saham','etf','emas','btc','rdana'].forEach(k => {
    if (!out[k].list.length) out[k].list = [{key:k+':_baru', n:'Produk baru (pilih sendiri)', v:0, kind:'rp', placeholder:true}];
  });
  return out;
}

// Pembagian dana (logika sama dengan prototipe): rebalance mengisi yang paling kurang dulu, DCA dibagi rata sesuai bobot.
function bbDistribute(list, dana, total, mode, kas) {
  const twA = list.reduce((s,a)=>s+(a.on?a.tw:0),0);
  const w = a => !a.on ? 0 : (kas ? a.tw : (twA ? a.tw/twA : 0));
  let alloc;
  if (mode === 'dca') alloc = list.map(a => dana*w(a));
  else {
    const gapAll = list.map(a => Math.max(0, total*a.tw - a.v));
    const gap = gapAll.map((g,i) => list[i].on ? g : 0);
    const base = kas ? gapAll : gap;
    const sg = base.reduce((s,g)=>s+g,0);
    if (sg > 0 && sg >= dana) alloc = gap.map(g => dana*g/sg);
    else { const rest = dana - sg; alloc = gap.map((g,i) => g + rest*w(list[i])); }
  }
  const used = alloc.reduce((s,x)=>s+x,0);
  return {alloc, held: Math.max(0, dana - used)};
}

function bbCalc() {
  const S = bbState(), kurs = APP.data.kurs || 17800, dana = Math.max(0, +S.dana || 0);
  const kas = S.skipMode !== 'alih', mode = S.mode === 'dca' ? 'dca' : 'rebal', frac = S.frac === '1';
  const items = bbItems();
  const nilaiKelas = {saham:tSaham(), etf:tEtf(), emas:tEmas(), btc:tBtc(), rdana:tRdana(), obligasi:tObligasi()};
  const cur = Object.values(nilaiKelas).reduce((a,v)=>a+v,0), total = cur + dana;

  const K = BB_KELAS.map(c => ({...c, t: Math.max(0, bbTarget(c.k)), v: nilaiKelas[c.k], info: items[c.k]}));
  const sumT = K.reduce((s,c)=>s+c.t,0);
  K.forEach(c => {
    c.tw = sumT > 0 ? c.t/sumT : 0;
    c.skip = !!S.skip['kelas:'+c.k];
    c.items = c.info.list.map(it => {
      const fee = it.kind==='lot' ? (S.feeBei||0)/100 : it.kind==='etf' ? (S.feeUs||0)/100 : 0;
      let unit, free = false, dec = 0;
      if (it.kind === 'lot')      unit = (it.p||0) * 100 * (1+fee);
      else if (it.kind === 'etf') { unit = (it.p||0) * kurs * (1+fee); if (frac) { free = true; dec = 4; } }
      else if (it.kind === 'gram') unit = it.p || 0;
      else if (it.kind === 'sbn') unit = 1000000;
      else { unit = 1000; free = true; }   // beli per Rp 1.000
      // aturan saham Mahal (harga kini di atas rentang wajar)
      const mahal = it.wajar === 'mahal';
      const autoSkip = mahal && S.mahal === 'lewati' && !S.paksa[it.key] && !S.skip[it.key];
      const half = mahal && S.mahal === 'kurangi';
      return {...it, fee, unit, free, dec, mahal, autoSkip, half, on: !c.skip && !S.skip[it.key] && !autoSkip};
    });
    // porsi di dalam kelas (default rata)
    const n = c.items.length;
    c.items.forEach(it => { it.porsi = S.porsi[it.key] != null ? +S.porsi[it.key] : 100/n; });
    const sp = c.items.reduce((s,it)=>s+Math.max(0,it.porsi),0);
    c.sumPorsi = sp;
    const pf = it => Math.max(0,it.porsi) * (it.half ? 0.5 : 1);   // porsi saham Mahal dipotong ½ (mode kurangi)
    const spf = c.items.reduce((s,it)=>s+pf(it),0);
    c.items.forEach(it => { it.w = spf > 0 ? pf(it)/spf : 0; });
    c.on = !c.skip && c.items.some(it => it.on);
  });

  // Level 1: kelas
  const L1 = bbDistribute(K.map(c => ({tw:c.tw, v:c.v, on:c.on})), dana, total, mode, kas);
  let held = L1.held;
  const all = [];
  K.forEach((c,ci) => {
    c.alloc = L1.alloc[ci];
    const sumV = c.items.reduce((s,it)=>s+it.v,0);
    c.itemsTotal = sumV + c.alloc;
    // Level 2: kode di dalam kelas
    const L2 = bbDistribute(c.items.map(it => ({tw:it.w, v:it.v, on:it.on})), c.alloc, c.itemsTotal, mode, kas);
    held += L2.held;
    c.items.forEach((it,ii) => {
      it.alloc = L2.alloc[ii];
      it.ideal = c.itemsTotal * it.w;
      it.cls = c;
      // bulatkan ke satuan
      if (!it.unit || it.alloc <= 0) { it.units = 0; it.cost = 0; }
      else if (it.free && it.kind === 'etf') { it.units = Math.floor(it.alloc/it.unit*1e4)/1e4; it.cost = it.units*it.unit; }
      else if (it.free) { it.units = Math.floor(it.alloc/1000)*1000; it.cost = it.units; }
      else { it.units = Math.floor(it.alloc/it.unit); it.cost = it.units*it.unit; }
      all.push(it);
    });
  });
  const allocSum = dana - held;
  let left = allocSum - all.reduce((s,it)=>s+it.cost,0);

  // sisa receh: +1 satuan ke kelas yang paling jauh di bawah targetnya (lalu kode yang paling kurang di kelas itu)
  const kelasGap = c => total*c.tw - (c.v + c.items.reduce((s,it)=>s+it.cost,0));
  for (let guard=0; guard<500; guard++) {
    let best=null, bestK=0, bestI=-Infinity;
    all.forEach(it => {
      if (!it.on || it.free || !it.unit || it.unit > left + 0.5) return;
      const gk = kelasGap(it.cls); if (gk <= 0) return;
      const gi = it.ideal - (it.v + it.cost);
      if (gk > bestK || (gk === bestK && gi > bestI)) { bestK = gk; bestI = gi; best = it; }
    });
    if (!best) break;
    best.units += 1; best.cost += best.unit; left -= best.unit;
  }
  // sisa terakhir ke kode fraksional yang kelasnya masih di bawah target
  all.forEach(it => {
    if (!it.on || !it.free || !it.unit || left < 1000) return;
    const g = kelasGap(it.cls); if (g <= 0) return;
    if (it.kind === 'etf') { const add = Math.floor(Math.min(g,left)/it.unit*1e4)/1e4; it.units = +(it.units+add).toFixed(4); it.cost += add*it.unit; left -= add*it.unit; }
    else { const add = Math.floor(Math.min(g,left)/1000)*1000; it.units += add; it.cost += add; left -= add; }
  });
  const spent = allocSum - left;
  K.forEach(c => { c.spent = c.items.reduce((s,it)=>s+it.cost,0); });
  return {S, K, dana, cur, total, spent, held, left, sumT, kurs, after: cur + spent};
}

// ── aksi ──
function bbSet(f, v) { const S = bbState(); S[f] = v; scheduleSave(); render(); }
function bbSetNum(f, el) { bbSet(f, Math.max(0, parseFloat(el.value) || 0)); }
function bbSetTarget(k, el) { bbState().target[k] = Math.max(0, parseFloat(el.value) || 0); scheduleSave(); render(); }
function bbResetTarget() { bbState().target = {}; scheduleSave(); render(); }
function bbSetPorsi(k, key, el) {
  const S = bbState(), items = bbItems()[k].list, n = items.length;
  items.forEach(it => { if (S.porsi[it.key] == null) S.porsi[it.key] = +(100/n).toFixed(2); });
  S.porsi[key] = Math.max(0, parseFloat(el.value) || 0);
  scheduleSave(); render();
}
function bbBagiRata(k) { const S = bbState(); bbItems()[k].list.forEach(it => delete S.porsi[it.key]); scheduleSave(); render(); }
function bbPaksa(key, v) { const S = bbState(); if (v) S.paksa[key] = true; else delete S.paksa[key]; scheduleSave(); render(); }
function bbToggle(key) { const S = bbState(); if (S.skip[key]) delete S.skip[key]; else S.skip[key] = true; scheduleSave(); render(); }
function bbCopy() {
  const t = document.getElementById('bb-txt'), m = document.getElementById('bb-cpmsg');
  navigator.clipboard.writeText(t.value).then(() => { if (m) m.textContent = '✓ Tersalin'; })
    .catch(() => { t.select(); if (m) m.textContent = 'Tekan Ctrl/Cmd+C untuk menyalin'; });
}

function bbBeliText(it) {
  const q = v => Q(v);
  if (!it.units) return '';
  if (it.kind === 'lot') return `${q(F(it.units))} lot (${q(F(it.units*100))} lembar)`;
  if (it.kind === 'etf') return `${q(F(it.units, it.free?4:0))} lembar`;
  if (it.kind === 'gram') return `${q(F(it.units))} gram`;
  if (it.kind === 'sbn') return `${q(F(it.units))} unit (${Rp(it.units*1000000)})`;
  return Rp(it.units);
}
function bbHarga(it, kurs) {
  if (it.kind === 'lot') return `@ ${Rp(it.p)}`;
  if (it.kind === 'etf') return `@ ${Usd(it.p)}`;
  if (it.kind === 'gram') return `@ ${Rp(it.p)}/gr`;
  if (it.est === 'gram' && it.p) return `≈ ${Q(F(it.units/it.p, 4))} gram`;
  if (it.est === 'koin' && it.p) return `≈ ${Q(F(it.units/it.p, 6))} ${it.n}`;
  return '';
}

function vBeli() {
  const R0 = bbCalc(), {S, K} = R0;
  const pctF = v => F(v*100, 1) + '%';
  const sumOk = Math.abs(R0.sumT - 100) < 0.05;
  const tog = (key, on, label) => `<button class="bb-tg ${on?'on':'off'}" onclick="bbToggle('${bbAttr(key)}')" title="${bbAttr(label)}">${on?'Aktif':'Skip'}</button>`;
  const wajarBadge = w => !w ? '' : w==='mahal' ? `<span class="bb-badge bad" title="Harga kini di atas rentang wajar">⚠️ Mahal</span>` : w==='diskon' ? `<span class="bb-badge good" title="Harga kini di bawah rentang wajar">✅ Diskon</span>` : `<span class="bb-badge" title="Harga kini dalam rentang wajar">⚖️ Wajar</span>`;
  const nilaiAll = R0.cur;
  const itemTog = it => {
    if (it.placeholder) return '';
    if (S.skip[it.key]) return tog(it.key, false, it.n);
    if (it.autoSkip) return `<button class="bb-tg off" onclick="bbPaksa('${bbAttr(it.key)}',true)" title="Harga di atas rentang wajar, dilewati otomatis. Klik untuk tetap beli.">Skip</button>`;
    if (it.mahal && S.mahal === 'lewati' && S.paksa[it.key]) return `<button class="bb-tg on" onclick="bbPaksa('${bbAttr(it.key)}',false)" title="Tetap dibeli walau Mahal. Klik untuk kembali dilewati otomatis.">Aktif</button>`;
    return tog(it.key, true, it.n);
  };
  const mahalNote = it => !it.mahal || S.skip[it.key] ? ''
    : it.autoSkip ? ` <span class="bb-mnote">dilewati otomatis</span>`
    : it.half ? ` <span class="bb-mnote">porsi ×½</span>`
    : (S.mahal === 'lewati' && S.paksa[it.key]) ? ` <span class="bb-mnote">tetap dibeli</span>` : '';

  // ── blok target & kode per kelas
  const kelasBlocks = K.map(c => {
    ensureTargetDefaults();
    const ta = APP.data.targetAlokasi.kelas[c.k] || {min:0,max:0};
    const rentang = ta.min === ta.max ? `${ta.min}%` : `${ta.min}–${ta.max}%`;
    const now = nilaiAll > 0 ? c.v/nilaiAll : 0;
    const dipakai = c.t > 0;
    const hint = (c.k==='saham'||c.k==='etf') && c.info.hasAny
      ? (c.info.holdOnly ? `Hanya kode bertanda <b>Hold</b>, yang Swing tidak ikut.` : `Belum ada kode bertanda <b>Hold</b>, jadi semua kode selain Swing dipakai. Tandai Hold di tab ${c.l} untuk memilih.`)
      : '';
    const rows = !dipakai ? '' : `
      <div class="bb-items">
        <div class="bb-ihead"><span></span><span>Kode</span><span class="r">Nilai sekarang</span><span class="r">Harga</span><span class="r">Porsi di kelas</span></div>
        ${c.items.map(it => `<div class="bb-irow${it.on?'':' off'}">
          <span class="bb-i-tg">${itemTog(it)}</span>
          <span class="bb-i-n"><b>${it.n}</b> ${wajarBadge(it.wajar)}${mahalNote(it)}</span>
          <span class="r bb-i-v">${Rp(R(it.v))}</span>
          <span class="r bb-muted bb-i-p">${it.kind==='lot'?Rp(it.p)+'/lbr':it.kind==='etf'?Usd(it.p):it.kind==='gram'||it.est==='gram'?(it.p?Rp(it.p)+'/gr':'–'):it.est==='koin'?(it.p?Rp(it.p):'–'):it.kind==='sbn'?'Rp 1 jt/unit':'–'}</span>
          <span class="r bb-i-po">${c.items.length>1 ? `<input class="cell-input bb-num" type="number" min="0" step="1" value="${+it.porsi.toFixed(1)}" onchange="bbSetPorsi('${c.k}','${bbAttr(it.key)}',this)"> %` : '<span class="bb-muted">100%</span>'}</span>
        </div>`).join('')}
        <div class="bb-ifoot">${hint}${c.items.length>1?` <span class="${Math.abs(c.sumPorsi-100)>0.05?'bb-warn':''}">Total porsi ${F(c.sumPorsi,1)}%${Math.abs(c.sumPorsi-100)>0.05?' (dihitung proporsional)':''}</span> · <button class="link-btn" onclick="bbBagiRata('${c.k}')">Bagi rata</button>`:''}</div>
      </div>`;
    return `<div class="bb-kelas${c.on||!dipakai?'':' off'}">
      <div class="bb-khead">
        <span class="bb-kname"><span class="legend-dot" style="background:${c.c}"></span>${c.l}</span>
        <span class="bb-muted">sekarang <b>${pctF(now)}</b></span>
        <span class="bb-muted">Target Alokasi ${rentang}</span>
        <span class="bb-tgt">Target beli <input class="cell-input bb-num" type="number" min="0" max="100" step="0.5" value="${+c.t.toFixed(2)}" onchange="bbSetTarget('${c.k}',this)"> %</span>
        ${dipakai ? tog('kelas:'+c.k, !c.skip, 'Skip seluruh '+c.l) : `<span class="bb-muted bb-small">Target 0%, tidak dibeli</span>`}
      </div>
      ${rows}
    </div>`;
  }).join('');

  // ── hasil
  const statusText = (c, it) => {
    if (c.skip) return `<span class="bb-badge warn">Kelas di-skip</span>`;
    if (it.autoSkip) return `<span class="bb-badge bad">Mahal, dilewati</span>`;
    if (!it.on) return `<span class="bb-badge warn">Di-skip</span>`;
    if (c.alloc <= 0) return mode1(c);
    if (!it.units) return `<span class="bb-badge warn">${it.alloc>0?'Belum cukup untuk 1 '+(it.kind==='lot'?'lot':it.kind==='gram'?'gram':it.kind==='sbn'?'unit':'lembar'):'Sudah sesuai porsi'}</span>`;
    return '';
  };
  const mode1 = c => `<span class="bb-badge warn">${S.mode!=='dca' && c.v > R0.total*c.tw ? 'Di atas target, dilewati' : 'Tidak dapat jatah'}</span>`;
  const after = R0.after;
  const hasBuys = K.some(c => c.items.some(it => it.on && it.units > 0));
  const hasil = R0.dana <= 0 ? `<div class="bb-empty">Isi <b>Dana bulan ini</b> di atas untuk melihat daftar belanja.</div>` : `
    <div class="bb-tiles">
      <div><span>Total setelah beli</span><b>${Rp(R(after))}</b></div>
      <div><span>Terpakai</span><b>${Rp(R(R0.spent))}</b></div>
      <div><span>Ditahan kas (di-skip)</span><b>${Rp(R(R0.held))}</b></div>
      <div><span>Sisa</span><b>${Rp(R(R0.left))}</b></div>
    </div>
    ${R0.left >= 50000 ? `<div class="bb-note" style="margin:-4px 0 12px">Sisa ${Rp(R(R0.left))} belum terpakai karena harga 1 lot/lembar/gram berikutnya lebih besar dari kekurangan kelasnya. Bisa disimpan untuk bulan depan${S.frac!=='1'?', atau ubah ETF US ke <b>Bisa fraksional</b>':''}.</div>` : ''}
    <div class="table-wrap"><table class="bb-tbl">
      <thead><tr><th>Aset</th><th>Beli</th><th class="r">Biaya</th><th class="r">Bobot sekarang</th><th class="r">Setelah beli</th><th class="r">Target</th></tr></thead>
      <tbody>${K.filter(c => c.t > 0 || c.spent > 0).map(c => {
        const w0 = R0.cur ? c.v/R0.cur : 0, w1 = after ? (c.v+c.spent)/after : 0;
        return `<tr class="bb-crow"><td><span class="legend-dot" style="background:${c.c};display:inline-block;margin-right:7px"></span><b>${c.l}</b></td><td><span class="bb-mob bb-muted bb-small">Bobot ${pctF(w0)} → <b>${pctF(w1)}</b> · target ${pctF(c.tw)}</span></td>
          <td class="r"><b>${c.spent?Rp(R(c.spent)):'–'}</b></td><td class="r">${pctF(w0)}</td><td class="r"><b>${pctF(w1)}</b></td><td class="r">${pctF(c.tw)}</td></tr>`
        + c.items.map(it => {
          const st = statusText(c, it);
          return `<tr><td class="bb-ind">${it.n} ${wajarBadge(it.wajar)}</td>
            <td>${st || `<b>${bbBeliText(it)}</b> <span class="bb-muted bb-small">${bbHarga(it, R0.kurs)}</span>`}</td>
            <td class="r">${it.cost?Rp(R(it.cost)):'–'}</td><td></td><td></td><td></td></tr>`;
        }).join('');
      }).join('')}</tbody>
    </table></div>
    <div class="form-group" style="margin-top:14px"><label>Ringkasan (bisa disalin)</label>
      <textarea id="bb-txt" class="bb-txt" readonly>${bbSummary(R0)}</textarea></div>
    <div class="bb-actions">
      <button class="btn btn-sm" onclick="bbCopy()">📋 Salin ringkasan</button><span id="bb-cpmsg" class="bb-muted bb-small"></span>
      <span class="bb-act-gap"></span>
      ${APP.privacy ? `<span class="bb-muted bb-small">Matikan <b>Sembunyikan nominal</b> untuk mencatat pembelian.</span>` : ''}
      <button class="btn btn-success btn-sm" onclick="bbOpenConfirm()" ${APP.privacy || !hasBuys ? 'disabled' : ''}>✅ Tandai sudah dibeli</button>
    </div>`;
  const flash = APP.bbFlash; APP.bbFlash = null;
  const bulanIni = bbToday().slice(0,7), sudah = (APP.data.riwayatBeli||[]).find(e => (e.tgl||'').slice(0,7) === bulanIni);
  const bannerSudah = sudah ? `<div class="bb-done">✅ Pembelian ${new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric'})} sudah dicatat tanggal ${bbTgl(sudah.tgl)} (terpakai ${Rp(R(sudah.spent))}). Daftar di bawah dihitung ulang dari holding terbaru.</div>` : '';

  return `
  <div class="section-header"><span class="section-title">🛒 Beli Bulanan</span></div>
  <div class="bb-intro">Isi dana bulan ini. Dana dibagi ke kelas aset yang paling jauh di bawah target, lalu ke kode di dalamnya, dan dibulatkan ke lot, lembar, gram, atau kelipatan Rp 1.000. Nilai dan harga diambil dari holding; klik <b>Update Harga</b> di tab Saham BEI dan US dulu supaya harganya terbaru.</div>

  <div class="bb-panel">
    <div class="bb-grid">
      <div class="form-group bb-wide"><label>Dana bulan ini (Rp)</label><input type="${APP.privacy?'password':'number'}" inputmode="numeric" autocomplete="off" min="0" step="100000" value="${S.dana||''}" placeholder="contoh 5000000" onchange="bbSetNum('dana',this)"></div>
      <div class="form-group bb-wide"><label>Jatah aset yang di-skip</label><select onchange="bbSet('skipMode',this.value)"><option value="kas" ${S.skipMode!=='alih'?'selected':''}>Tahan jadi kas</option><option value="alih" ${S.skipMode==='alih'?'selected':''}>Alihkan ke aset aktif</option></select></div>
      <div class="form-group bb-wide"><label>Saham ⚠️ Mahal</label><select onchange="bbSet('mahal',this.value)"><option value="lewati" ${S.mahal==='lewati'?'selected':''}>Lewati otomatis</option><option value="kurangi" ${S.mahal==='kurangi'?'selected':''}>Kurangi porsi ½</option><option value="beli" ${S.mahal==='beli'?'selected':''}>Tetap dibeli</option></select></div>
      <div class="form-group"><label>Fee beli BEI (%)</label><input type="number" min="0" step="0.01" value="${S.feeBei}" onchange="bbSetNum('feeBei',this)"></div>
      <div class="form-group"><label>Fee beli US (%)</label><input type="number" min="0" step="0.01" value="${S.feeUs}" onchange="bbSetNum('feeUs',this)"></div>
      <div class="form-group"><label>ETF US</label><select onchange="bbSet('frac',this.value)"><option value="1" ${S.frac==='1'?'selected':''}>Bisa fraksional</option><option value="0" ${S.frac!=='1'?'selected':''}>Per lembar</option></select></div>
      <div class="form-group"><label>Kurs USD/IDR</label><div class="bb-kurs">Rp ${F(R0.kurs)} <span class="bb-muted bb-small">· ubah di Dashboard</span></div></div>
    </div>
    <div class="bb-mode">
      <button class="${S.mode!=='dca'?'on':''}" onclick="bbSet('mode','rebal')">Rebalance <span>isi yang paling kurang</span></button>
      <button class="${S.mode==='dca'?'on':''}" onclick="bbSet('mode','dca')">DCA rata <span>bagi sesuai target</span></button>
    </div>
  </div>

  <div class="bb-panel">
    <div class="bb-phead"><b>Target &amp; kode per kelas</b>
      <span class="${sumOk?'bb-muted':'bb-warn'}">Total target beli ${F(R0.sumT,1)}%${sumOk?'':' · harus 100%, sementara dihitung proporsional'}</span>
      <button class="link-btn" onclick="bbResetTarget()">Isi dari titik tengah Target Alokasi</button></div>
    ${kelasBlocks}
    <div class="bb-note">Aset yang di-skip tetap dihitung di total portofolio, hanya tidak dibeli bulan ini. Label Mahal/Wajar/Diskon membandingkan harga kini dengan rentang Harga Wajar di tab Saham BEI. ${S.mahal==='lewati' ? 'Saham Mahal dilewati otomatis dan jatahnya mengikuti pilihan <b>Jatah aset yang di-skip</b>; klik tombol Skip di kodenya kalau tetap mau beli.' : S.mahal==='kurangi' ? 'Porsi saham Mahal dipotong setengah, selisihnya pindah ke kode lain di kelas yang sama.' : 'Saham Mahal tetap dibeli seperti biasa.'}</div>
  </div>

  <div class="bb-panel">
    <div class="bb-phead"><b>Daftar belanja</b><span class="bb-badge">${S.mode==='dca'?'Mode DCA rata':'Mode Rebalance'}</span></div>
    ${flash ? `<div class="bb-flash">${flash}</div>` : ''}
    ${bannerSudah}
    ${hasil}
  </div>

  ${vBbRiwayat()}`;
}

function bbSummary(R0) {
  const tgl = new Date().toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
  const L = [`Beli bulan ini (${tgl}) — dana ${Rp(R(R0.dana))}, ${R0.S.mode==='dca'?'mode DCA rata':'mode Rebalance'}`];
  R0.K.forEach(c => {
    const buys = c.items.filter(it => it.units > 0);
    if (!buys.length) return;
    L.push('', c.l + ':');
    buys.forEach(it => {
      if (it.kind === 'lot' || it.kind === 'etf' || it.kind === 'gram') L.push(`- ${it.n}: ${bbBeliText(it)} ≈ ${Rp(R(it.cost))}`);
      else { const est = bbHarga(it, R0.kurs); L.push(`- ${it.n}: ${bbBeliText(it)}${est ? ` (${est})` : ''}`); }
    });
  });
  const sk = [];
  R0.K.forEach(c => { if (c.t <= 0) return; if (c.skip) sk.push(c.l); else c.items.filter(it => !it.on && !it.placeholder).forEach(it => sk.push(it.n + (it.autoSkip ? ' (Mahal)' : ''))); });
  L.push('');
  if (sk.length) L.push(`Di-skip: ${sk.join(', ')}${R0.S.skipMode!=='alih' ? ` (jatah ditahan ${Rp(R(R0.held))})` : ' (jatah dialihkan)'}`);
  L.push(`Terpakai ${Rp(R(R0.spent))}, sisa ${Rp(R(R0.left))}`);
  return L.join('\n').replace(/</g,'&lt;');
}

// ── BELI BULANAN (Tahap 2): tandai sudah dibeli + riwayat ─
// Pembelian yang dikonfirmasi ditambahkan sebagai baris holding baru (ditandai field 'bb' = id riwayat),
// reksadana ditambahkan ke produk yang sudah ada. Riwayat tersimpan di APP.data.riwayatBeli dan bisa dibatalkan.
const bbToday = () => ymd(new Date());
const bbTgl = t => { const d = new Date((t||'') + 'T00:00:00'); return isNaN(d) ? (t||'-') : d.toLocaleDateString('id-ID', {day:'numeric', month:'short', year:'numeric'}); };
const bbLastRow = (arr, fn) => { const a = (APP.data[arr]||[]).filter(fn); return a.length ? a[a.length-1] : null; };
const bbNum = id => { const el = document.getElementById(id); return el ? (parseFloat(el.value) || 0) : 0; };
const bbStr = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
const bbBase = key => key.slice(key.indexOf(':') + 1);

function bbOpenConfirm() {
  if (APP.privacy) return;
  const R0 = bbCalc(), rows = [];
  R0.K.forEach(c => c.items.forEach(it => {
    if (!it.on || !(it.units > 0)) return;
    rows.push({k:c.k, kl:c.l, key:it.key, n:it.n, kind:it.kind, p:it.p||0, placeholder:!!it.placeholder, units:it.units, cost:it.cost});
  }));
  if (!rows.length) return;
  APP.bbConfirm = {rows};
  render();
  bbcTotal();
}
function bbCloseConfirm() { APP.bbConfirm = null; render(); }

// biaya satu baris di modal, dari isian saat ini
function bbcRowCost(r, i) {
  const S = bbState(), kurs = APP.data.kurs || 17800, g = f => bbNum(`bbc_${i}_${f}`);
  if (r.k === 'saham') return g('lot') * 100 * g('harga') * (1 + (S.feeBei||0)/100);
  if (r.k === 'etf')   return g('unit') * g('harga') * kurs * (1 + (S.feeUs||0)/100);
  if (r.kind === 'gram') return g('gram') * g('harga');
  if (r.kind === 'sbn')  return g('unit') * 1000000;
  return g('rp');
}
function bbcTotal() {
  const C = APP.bbConfirm; if (!C) return;
  let tot = 0;
  C.rows.forEach((r, i) => {
    const on = document.getElementById(`bbc_${i}_on`), c = bbcRowCost(r, i), el = document.getElementById(`bbc_${i}_cost`);
    if (el) el.textContent = c > 0 ? Rp(R(c)) : '';
    const row = on && on.closest('.bbc-row'); if (row) row.classList.toggle('off', !on.checked);
    if (on && on.checked) tot += c;
  });
  const t = document.getElementById('bbc-total'); if (t) t.textContent = Rp(R(tot));
}

function vBbConfirm() {
  const C = APP.bbConfirm; if (!C) return '';
  const S = bbState();
  const fld = (i, f, l, v, o={}) => {
    const num = !o.type || o.type === 'number';
    return `<label class="bbc-f${o.w?' w':''}"><span>${l}</span><input id="bbc_${i}_${f}" type="${o.type||'number'}" ${num?`step="${o.step||'any'}" min="0" inputmode="decimal"`:''} value="${v===''||v==null?'':v}" placeholder="${o.ph||''}" oninput="bbcTotal()"></label>`;
  };
  const rowsHtml = C.rows.map((r, i) => {
    const est = d => r.p ? +(r.units / r.p).toFixed(d) : '';
    let f;
    if (r.placeholder) {
      if (r.k === 'saham')      f = fld(i,'kode','Kode','',{type:'text',ph:'BBCA'}) + fld(i,'lot','Lot','',{step:'1'}) + fld(i,'harga','Harga/lembar','');
      else if (r.k === 'etf')   f = fld(i,'kode','Kode','',{type:'text',ph:'VOO'}) + fld(i,'unit','Lembar','',{step:'0.0001'}) + fld(i,'harga','Harga USD','',{step:'0.01'});
      else if (r.k === 'emas')  f = fld(i,'lokasi','Platform','',{type:'text',ph:'Pegadaian'}) + fld(i,'rp','Rupiah',R(r.units)) + fld(i,'gram','Gram didapat','',{step:'0.0001'});
      else if (r.k === 'btc')   f = fld(i,'jenis','Jenis','',{type:'text',ph:'BTC'}) + fld(i,'rp','Rupiah',R(r.units)) + fld(i,'koin','Jumlah koin','',{step:'0.00000001'});
      else                      f = fld(i,'nama','Nama reksadana','',{type:'text',ph:'nama produk',w:1}) + fld(i,'rp','Rupiah',R(r.units));
    }
    else if (r.kind === 'lot')  f = fld(i,'lot','Lot',r.units,{step:'1'}) + fld(i,'harga','Harga/lembar',r.p);
    else if (r.kind === 'etf')  f = fld(i,'unit','Lembar',r.units,{step:'0.0001'}) + fld(i,'harga','Harga USD',r.p,{step:'0.01'});
    else if (r.kind === 'gram') f = fld(i,'gram','Gram',r.units) + fld(i,'harga','Harga/gram',r.p);
    else if (r.kind === 'sbn')  f = fld(i,'unit','Unit (Rp 1 jt)',r.units,{step:'1'}) + fld(i,'seri','Seri','',{type:'text',ph:'ORI027'}) + fld(i,'kupon','Kupon %/th','',{step:'0.01'}) + fld(i,'jt','Jatuh tempo','',{type:'date'});
    else if (r.k === 'emas')    f = fld(i,'rp','Rupiah',R(r.units)) + fld(i,'gram','Gram didapat',est(4),{step:'0.0001'});
    else if (r.k === 'btc')     f = fld(i,'rp','Rupiah',R(r.units)) + fld(i,'koin','Jumlah koin',est(8),{step:'0.00000001'});
    else                        f = fld(i,'rp','Rupiah',R(r.units));
    return `<div class="bbc-row">
      <label class="bbc-head"><input type="checkbox" id="bbc_${i}_on" checked onchange="bbcTotal()"><span class="bb-muted">${r.kl}</span><b>${r.placeholder?'Produk baru':r.n}</b><span class="bbc-cost" id="bbc_${i}_cost"></span></label>
      <div class="bbc-fields">${f}</div></div>`;
  }).join('');
  return `<div class="modal-overlay" onclick="if(event.target===this)bbCloseConfirm()">
  <div class="modal-box bbc-box">
    <div class="modal-title" style="margin-bottom:4px">Tandai sudah dibeli</div>
    <div class="bb-muted" style="font-size:12.5px;margin-bottom:12px;line-height:1.5">Sesuaikan dengan yang benar-benar dibeli (jumlah dan harga dari aplikasi broker). Hapus centang untuk yang tidak jadi dibeli. Setiap pembelian ditambahkan sebagai baris baru di tab asetnya; reksadana ditambahkan ke produk yang sama.</div>
    <div class="form-group" style="max-width:190px"><label>Tanggal beli</label><input type="date" id="bbc_tgl" value="${bbToday()}"></div>
    ${rowsHtml}
    <div id="bbc-err" class="alert alert-red" style="display:none;margin-top:10px"></div>
    <div class="modal-actions bbc-actions">
      <div class="bbc-total"><span class="bb-muted bb-small">Total dibeli</span><b id="bbc-total"></b><span class="bb-muted bb-small">dari dana ${Rp(R(S.dana))}</span></div>
      <button class="btn" onclick="bbCloseConfirm()">Batal</button>
      <button class="btn btn-primary" onclick="bbConfirmSave()">✅ Simpan ke holding</button>
    </div>
  </div></div>`;
}

function bbConfirmSave() {
  const C = APP.bbConfirm; if (!C) return;
  const S = bbState(), R0 = bbCalc(), kurs = APP.data.kurs || 17800;
  const feeB = 1 + (S.feeBei||0)/100, feeU = 1 + (S.feeUs||0)/100;
  const tgl = bbStr('bbc_tgl') || bbToday(), id = 'bb' + Date.now();
  const items = [], ops = [], errs = [], rdAdds = [];
  const push = (arr, row) => ops.push(() => { if (!APP.data[arr]) APP.data[arr] = []; APP.data[arr].push(row); });

  C.rows.forEach((r, i) => {
    const on = document.getElementById(`bbc_${i}_on`); if (!on || !on.checked) return;
    const g = f => bbNum(`bbc_${i}_${f}`), t = f => bbStr(`bbc_${i}_${f}`), base = bbBase(r.key);
    const label = r.placeholder ? `${r.kl} (produk baru)` : r.n;
    if (r.k === 'saham') {
      const kode = (r.placeholder ? t('kode') : base).toUpperCase(), lot = Math.round(g('lot')), harga = g('harga');
      if (!kode || lot <= 0 || harga <= 0) return errs.push(`${label}: isi ${r.placeholder?'kode, ':''}lot dan harga.`);
      const tp = bbLastRow('saham', x => (x.kode||'').toUpperCase() === kode);
      const row = {tgl, kode, kategori: tp ? (tp.kategori||'menengah') : 'menengah', lot, beli: harga, now: tp && tp.now ? tp.now : harga,
        wajarBawah: tp ? (tp.wajarBawah||0) : 0, wajarAtas: tp ? (tp.wajarAtas||0) : 0, posisi: tp ? posisiOf(tp) : 'hold', ket: '', bb: id};
      if (tp && tp.eps != null) row.eps = tp.eps;
      if (tp && tp.pbvRatio != null) row.pbvRatio = tp.pbvRatio;
      push('saham', row);
      items.push({k:'saham', n:kode, kind:'lot', qty:lot, harga, extra:0, cost: lot*100*harga*feeB});
    } else if (r.k === 'etf') {
      const kode = (r.placeholder ? t('kode') : base).toUpperCase(), unit = +g('unit').toFixed(4), harga = g('harga');
      if (!kode || unit <= 0 || harga <= 0) return errs.push(`${label}: isi ${r.placeholder?'kode, ':''}jumlah lembar dan harga.`);
      const tp = bbLastRow('etf', x => (x.kode||'').toUpperCase() === kode);
      push('etf', {tgl, kode, unit, beli: harga, now: tp && tp.now ? tp.now : harga, posisi: tp ? posisiOf(tp) : 'hold', ket: '', bb: id});
      items.push({k:'etf', n:kode, kind:'etf', qty:unit, harga, extra:0, cost: unit*harga*kurs*feeU});
    } else if (r.k === 'emas') {
      const [lok0, jen0] = base.split('|');
      if (r.kind === 'gram') {
        const gram = +g('gram').toFixed(4), harga = g('harga');
        if (gram <= 0 || harga <= 0) return errs.push(`${label}: isi gram dan harga per gram.`);
        const tp = bbLastRow('emas', x => (x.lokasi||'Emas') === lok0 && (x.jenis||'digital') === jen0);
        push('emas', {tgl, jenis: jen0 || 'fisik', lokasi: tp ? tp.lokasi : lok0, gram, beli: harga, now: tp && tp.now ? tp.now : harga, bb: id});
        items.push({k:'emas', n:lok0, kind:'gram', qty:gram, harga, extra:0, cost: gram*harga});
      } else {
        const lokasi = r.placeholder ? t('lokasi') : lok0, jenis = r.placeholder ? 'digital' : (jen0 || 'digital');
        const rp = Math.round(g('rp')), gram = +g('gram').toFixed(4);
        if (!lokasi || rp <= 0 || gram <= 0) return errs.push(`${label}: isi ${r.placeholder?'platform, ':''}rupiah dan gram yang didapat.`);
        const beli = Math.round(rp / gram);
        const tp = bbLastRow('emas', x => (x.lokasi||'Emas') === lokasi && (x.jenis||'digital') === jenis);
        push('emas', {tgl, jenis, lokasi, gram, beli, now: tp && tp.now ? tp.now : beli, bb: id});
        items.push({k:'emas', n:lokasi, kind:'rpgram', qty:rp, harga:beli, extra:gram, cost: rp});
      }
    } else if (r.k === 'btc') {
      const jenis = (r.placeholder ? t('jenis') : base).toUpperCase(), rp = Math.round(g('rp')), koin = +g('koin').toFixed(8);
      if (!jenis || rp <= 0 || koin <= 0) return errs.push(`${label}: isi ${r.placeholder?'jenis, ':''}rupiah dan jumlah koin.`);
      const beli = Math.round(rp / koin);
      const tp = bbLastRow('btc', x => (x.jenis||'BTC').toUpperCase() === jenis);
      push('btc', {tgl, jenis: tp ? (tp.jenis||jenis) : jenis, jumlah: koin, beli, now: tp && tp.now ? tp.now : beli, ket: '', bb: id});
      items.push({k:'btc', n:jenis, kind:'rpkoin', qty:rp, harga:beli, extra:koin, cost: rp});
    } else if (r.k === 'rdana') {
      const nama = r.placeholder ? t('nama') : base, rp = Math.round(g('rp'));
      if (!nama || rp <= 0) return errs.push(`${label}: isi ${r.placeholder?'nama reksadana dan ':''}rupiah.`);
      ops.push(() => {
        if (!APP.data.rdana) APP.data.rdana = [];
        const ex = APP.data.rdana.find(x => (x.item||'').trim().toLowerCase() === nama.toLowerCase());
        if (ex) { const now0 = ex.now || ex.masuk || 0; ex.masuk = (ex.masuk||0) + rp; ex.now = now0 + rp; rdAdds.push({item: ex.item, add: rp}); }
        else APP.data.rdana.push({item: nama, masuk: rp, now: rp, bb: id});
      });
      items.push({k:'rdana', n:nama, kind:'rp', qty:rp, harga:0, extra:0, cost: rp});
    } else if (r.k === 'obligasi') {
      const unit = Math.round(g('unit')), seri = t('seri').toUpperCase(), kupon = g('kupon'), jt = t('jt');
      if (unit <= 0 || !seri) return errs.push(`Obligasi: isi jumlah unit dan nama seri.`);
      push('obligasi', {tgl, nama: seri, jenis: (seri.match(/^[A-Z]+/) || ['SBN'])[0], unit, hargaPct: 100, kupon, jatuhTempo: jt, bb: id});
      items.push({k:'obligasi', n:seri, kind:'sbn', qty:unit, harga:1000000, extra:0, cost: unit*1000000});
    }
  });

  const errEl = document.getElementById('bbc-err');
  if (!errs.length && !items.length) errs.push('Centang minimal satu pembelian.');
  if (errs.length) { if (errEl) { errEl.innerHTML = errs.join('<br>'); errEl.style.display = 'block'; } return; }

  ops.forEach(f => f());
  const spent = items.reduce((a,x) => a + x.cost, 0);
  const entry = {id, tgl, dibuat: new Date().toISOString(), dana: R(R0.dana), mode: S.mode === 'dca' ? 'dca' : 'rebal',
    spent: R(spent), held: R(R0.held), items: items.map(x => ({...x, cost: R(x.cost)})), rd: rdAdds};
  APP.data.riwayatBeli = [entry, ...(APP.data.riwayatBeli || [])];
  APP.bbConfirm = null;
  APP.bbFlash = `✅ ${items.length} pembelian dicatat dan ditambahkan ke holding. Bisa dibatalkan dari Riwayat di bawah.`;
  scheduleSave();
  render();
}

function bbUndo(id) {
  const H = APP.data.riwayatBeli || [], e = H.find(x => x.id === id);
  if (!e) return;
  if (!confirm('Batalkan pencatatan ini? Baris holding yang ditambahkan dari pencatatan ini akan dihapus, dan tambahan modal reksadananya dikurangi lagi.')) return;
  ['saham','etf','emas','btc','obligasi','rdana'].forEach(a => { if (APP.data[a]) APP.data[a] = APP.data[a].filter(x => x.bb !== id); });
  (e.rd || []).forEach(d => {
    const ex = (APP.data.rdana || []).find(x => x.item === d.item);
    if (ex) { const now0 = ex.now || ex.masuk || 0; ex.masuk = Math.max(0, (ex.masuk||0) - d.add); ex.now = Math.max(0, now0 - d.add); }
  });
  APP.data.riwayatBeli = H.filter(x => x.id !== id);
  APP.bbFlash = '↩︎ Pencatatan dibatalkan.';
  scheduleSave();
  render();
}

function bbHistText(x) {
  if (x.kind === 'lot')    return `${Q(F(x.qty))} lot @ ${Rp(x.harga)}`;
  if (x.kind === 'etf')    return `${Q(F(x.qty, 4))} lembar @ ${Usd(x.harga)}`;
  if (x.kind === 'gram')   return `${Q(F(x.qty, 4))} gram @ ${Rp(x.harga)}`;
  if (x.kind === 'rpgram') return `${Rp(x.qty)} · ${Q(F(x.extra, 4))} gram`;
  if (x.kind === 'rpkoin') return `${Rp(x.qty)} · ${Q(F(x.extra, 8))} ${x.n}`;
  if (x.kind === 'sbn')    return `${Q(F(x.qty))} unit`;
  return Rp(x.qty);
}

function userHasPassword() {

function userHasGoogle() {
  const u = APP.user;

function setMsg(id, text, ok) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'alert ' + (ok ? 'alert-green' : 'alert-red');
  el.innerHTML = text;
  el.style.display = text ? 'block' : 'none';
}
function togglePwVisible(on) {
  ['pw-old','pw-new','pw-new2'].forEach(id => { const el = document.getElementById(id); if (el) el.type = on ? 'text' : 'password'; });
}
async function changePassword() {
  const oldPw = document.getElementById('pw-old').value;
  const newPw = document.getElementById('pw-new').value;
  const newPw2 = document.getElementById('pw-new2').value;
  setMsg('pw-msg', '');
  if (!oldPw || !newPw || !newPw2) return setMsg('pw-msg', 'Isi semua kolom dulu.');
  if (newPw.length < 6) return setMsg('pw-msg', 'Password baru minimal 6 karakter.');
  if (newPw !== newPw2) return setMsg('pw-msg', 'Ulangi password baru tidak sama.');
  if (newPw === oldPw) return setMsg('pw-msg', 'Password baru sama dengan password lama.');
  const btn = document.getElementById('pw-btn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Menyimpan...'; }
  try {
    const user = APP.auth.currentUser || APP.user;
    // Firebase meminta verifikasi ulang password lama sebelum boleh mengganti password
    const cred = firebase.auth.EmailAuthProvider.credential(user.email, oldPw);
    await user.reauthenticateWithCredential(cred);
    await user.updatePassword(newPw);
    ['pw-old','pw-new','pw-new2'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    setMsg('pw-msg', '✅ Password berhasil diganti. Pakai password baru saat login berikutnya. Kalau aplikasi juga terbuka di perangkat lain, perangkat itu mungkin diminta login ulang.', true);
  } catch(e) {
    const code = e && e.code;
    setMsg('pw-msg', (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') ? 'Password lama salah.' : authMsg(e));
  }
  if (btn) { btn.disabled = false; btn.textContent = 'Simpan Password Baru'; }
}
async function sendResetFromSettings() {
  setMsg('reset-msg', '');
  try {
    APP.auth.languageCode = 'id';
    await APP.auth.sendPasswordResetEmail(APP.user.email);
    setMsg('reset-msg', `✅ Link untuk membuat password baru sudah dikirim ke <b>${APP.user.email}</b>. Cek inbox (dan folder spam).`, true);
  } catch(e) { setMsg('reset-msg', authMsg(e)); }
}

      <main class="main">${content}</main>
    </div>
  </div>
  ${vModal()}
  ${vExportModal()}
  ${vEditModal()}
  ${vBbConfirm()}`;
  const newSb = document.querySelector('.sb-scroll');
  if (newSb) newSb.scrollTop = sbTop;
  if (APP.exportOpen) exportRefresh();
}
</script>
</body>
</html>
